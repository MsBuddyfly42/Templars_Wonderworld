</style></head><body><a class="skip-link" href="#main">Skip to craft studio</a><aside><a class="brand" href="#home"><b>t<span>✦</span></b>TEMPLAR’S<br>CRAFT STUDIO</a><p class="eyebrow">A LIFE OF MAKING</p><nav><button data-page="home">⌂ My craft studio</button><button data-page="crafts">✂ Craft library</button><button data-page="practice">◷ Daily practice</button><button data-page="passport">✓ Skill passport</button><button data-page="journal">♡ Maker journal</button></nav><div class="aside-bottom"><p>Made by hand. Made by you.</p><strong id="xp"></strong><p id="storageStatus"></p><a href="https://templars-wonderworld.onrender.com/">Visit Wonderworld ↗</a></div></aside><main id="main"><header><span>YOUR CRAFT STUDIO IS OPEN <i></i></span><span id="progress"></span></header><div id="view"></div></main><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({xp:0,crafts:{work:{},sessions:[],weeklyGoal:180}});
let state;try{state=JSON.parse(localStorage.getItem('templarsCraftStudioV1'))}catch{}if(!state||typeof state!=='object')state=fresh();let page='home',tick=null;
function persist(){try{localStorage.setItem('templarsCraftStudioV1',JSON.stringify(state));$('#storageStatus').textContent='Progress saves in this browser.'}catch{$('#storageStatus').textContent='Storage unavailable. Export a backup before leaving.'}$('#xp').textContent=Object.values(craftState().work).filter(w=>w.complete).length+' completed projects';$('#progress').textContent=craftState().sessions.length+' practice sessions'}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function head(label,title,desc){return `<div class="page-head"><div class="label">${esc(label)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>`}
function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({home:makerHome,crafts:craftLibrary,practice:practiceRoom,passport:skillPassport,journal:makerJournal})[p]();persist();window.scrollTo(0,0)}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restoreBackup(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const s=JSON.parse(await input.files[0].text());const c=s.crafts;if(!c||!c.work||typeof c.work!=='object'||Array.isArray(c.work)||!Array.isArray(c.sessions)||c.sessions.length>10000||!Number.isInteger(c.weeklyGoal)||c.weeklyGoal<15||c.weeklyGoal>10080)throw Error();for(const [id,w] of Object.entries(c.work)){if(!/^(?:[0-9]|1[0-5])$/.test(id)||!w||!Array.isArray(w.checks)||w.checks.length>5||w.checks.some(x=>typeof x!=='boolean')||typeof w.notes!=='string'||typeof w.complete!=='boolean'||(w.photo!==undefined&&(typeof w.photo!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(w.photo))))throw Error()}for(const x of c.sessions){if(!x||!Number.isSafeInteger(x.id)||!Number.isInteger(x.minutes)||x.minutes<1||x.minutes>1440||typeof x.skill!=='string'||typeof x.note!=='string'||!Number.isFinite(Date.parse(x.date)))throw Error()}if(confirm('Replace this browser’s craft progress with this backup?')){if(s.planner!==undefined&&(!Array.isArray(s.planner)||s.planner.some(p=>!p||typeof p.name!=='string'||typeof p.craft!=='string'||typeof p.plan!=='string'||typeof p.date!=='string'||!['Idea','In progress','Paused','Finished'].includes(p.status))))throw Error();if(s.supplies!==undefined&&(!Array.isArray(s.supplies)||s.supplies.some(p=>!p||typeof p.name!=='string'||typeof p.quantity!=='string'||!['have','need'].includes(p.status))))throw Error();state={xp:0,crafts:c,planner:s.planner||[],supplies:s.supplies||[],rowCount:Number.isSafeInteger(s.rowCount)&&s.rowCount>=0?s.rowCount:0};persist();go('journal');toast('Studio backup restored')}}catch{toast('Choose a valid craft studio backup. Current progress has been kept.')}};input.click()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelector('.brand').onclick=e=>{e.preventDefault();go('home')};

const CRAFTS=[{"id": 0, "name": "Sewing", "icon": "\u2702", "group": "Fabric & thread", "project": "Hand-sewn practice pouch", "supplies": "Two 15 \u00d7 20 cm woven cotton rectangles; needle; thread; pins or clips; ruler; scissors", "steps": ["Thread a needle with an arm-length of thread and knot one end. On a scrap, work small running stitches: in and out along a marked line.", "Place the rectangles right sides together. Mark a seam 1 cm from the two sides and bottom; leave the top open.", "Starting at the top of one side, backstitch down, across the bottom, and up the other side. For backstitch, come up ahead, stitch back into the previous hole, then come up ahead again.", "Fold the top edge inward 1 cm, then another 1 cm. Pin and hand stitch the hem, keeping the opening free.", "Turn right side out and gently push out corners. Inspect for gaps and reinforce the top of each side seam."], "safety": "Keep fingers clear of the needle. Store pins in a cushion and cut away from your body.", "review": "Pull gently at each seam. Are stitches secure and the opening usable?"}, {"id": 1, "name": "Knitting", "icon": "\u2301", "group": "Yarn & fiber", "project": "A garter-stitch sampler", "supplies": "Smooth light-colored medium yarn; matching needles from the yarn label; tapestry needle; scissors", "steps": ["Leave a tail about three times your intended swatch width. Make a slipknot on one needle; it counts as your first stitch.", "Use a knitted cast-on: knit into the slipknot without sliding it off, place the new loop on the left needle, and repeat until you have 16 stitches.", "Knit a row: insert the right needle into the front of the first loop from left to right, wrap working yarn counterclockwise, pull a new loop through, and slide the old loop off.", "Turn the work and knit every row. Count 16 stitches after each row. Continue until the swatch is about square.", "Bind off loosely: knit two, lift the first stitch over the second, knit one more and repeat. Cut yarn, pull the tail through the last loop, and weave ends through several stitches."], "safety": "Rest your hands frequently. Keep needles and yarn away from pets and small children.", "review": "Count stitches and compare edge width. Note where tension tightened or loosened."}, {"id": 2, "name": "Crochet", "icon": "\u25cc", "group": "Yarn & fiber", "project": "A single-crochet square \u00b7 US terms", "supplies": "Smooth medium yarn; matching crochet hook from yarn label; stitch marker; tapestry needle; scissors", "steps": ["Make a slipknot. Yarn over and pull through the loop repeatedly to make 16 chains. Keep chains loose enough to insert your hook.", "Insert into the second chain from the hook. Yarn over, pull up a loop, yarn over, pull through both loops: one single crochet.", "Work one single crochet into each remaining chain for 15 stitches. Mark the first and last stitch so you can find both edges.", "Chain one and turn; the turning chain does not count as a stitch here. Single crochet into each of the 15 stitches, under both top loops.", "Repeat rows until square. Cut a 15 cm tail, draw it through the last loop, and weave ends in."], "safety": "Take hand and shoulder breaks. This lesson uses US names; US single crochet is UK double crochet.", "review": "Count 15 stitches each row. If edges slope, check whether the first or last stitch was missed."}, {"id": 3, "name": "Embroidery", "icon": "\u2733", "group": "Fabric & thread", "project": "A three-stitch garden sampler", "supplies": "Cotton fabric; hoop; embroidery needle; floss; washable fabric marker; scissors", "steps": ["Draw three short stems with simple leaves. Place fabric in the hoop, smooth and firm without stretching it out of shape.", "Separate two strands of floss. Thread the needle and knot the end. Practice running stitch on one stem with evenly spaced in-and-out stitches.", "Backstitch the second stem: bring the needle up ahead, go down at the previous stitch end, then come up ahead again.", "Make detached-chain leaves: come up at the leaf base, go down in the same hole leaving a loop, come up at the tip inside the loop, and anchor it with a tiny stitch outside the loop.", "Fill a small flower center with parallel satin stitches. Secure thread under existing stitches on the back and trim."], "safety": "Use a needle appropriate to the fabric and keep a pin cushion nearby.", "review": "Are the leaves anchored and fabric flat rather than puckered?"}, {"id": 4, "name": "Quilting", "icon": "\u25a6", "group": "Fabric & thread", "project": "A four-patch quilt block", "supplies": "Four equal 10 cm cotton squares; needle and thread or sewing machine; ruler; iron", "steps": ["Arrange four squares in a two-by-two layout. Mark a consistent 6 mm seam allowance.", "Place the top pair right sides together and sew one shared edge. Repeat for the bottom pair.", "Press the top seam to one side and the bottom seam to the opposite side. Follow your fabric\u2019s heat setting.", "Place the two rows right sides together, matching the center seams. Pin and sew across.", "Open and press. Measure both directions. This is a pieced block; batting, backing and quilting are later steps."], "safety": "Keep fingers away from the iron and machine needle. Unplug the iron after use.", "review": "Do the center corners meet? Compare seam allowances before trimming."}, {"id": 5, "name": "Weaving", "icon": "\u25a5", "group": "Yarn & fiber", "project": "A cardboard loom coaster", "supplies": "Sturdy cardboard; ruler; scissors; cotton yarn for warp; yarn scraps; blunt tapestry needle", "steps": ["Cut a 12 \u00d7 16 cm cardboard loom. Mark eight evenly spaced notches along each short edge and cut shallow slots.", "Wrap warp yarn from top to bottom, passing through corresponding notches. Tape the ends to the back; keep tension even.", "Thread a blunt needle with a short weft length. Pass over one warp, under the next, across the row.", "Return in the opposite pattern. Leave a small arc of yarn before gently packing the row down so edges do not pull inward.", "Continue for about 10 cm. Remove carefully; cut warp loops and tie neighboring pairs. Weave in loose weft ends."], "safety": "Use blunt needles where possible and handle scissors carefully.", "review": "Are edges straight and rows snug without bunching?"}, {"id": 6, "name": "Macram\u00e9", "icon": "\u2667", "group": "Yarn & fiber", "project": "A square-knot cord sampler", "supplies": "Four 60 cm cotton cords; a ring or dowel; tape; scissors", "steps": ["Secure your ring or dowel to a stable surface. Fold two cords in half over it and pull their tails through each fold: two lark\u2019s-head knots.", "Arrange the four hanging strands. The middle two are filler cords; the outer two do the knotting.", "Take the left cord over the middle pair and under the right cord. Pass the right cord behind the middle pair and up through the left loop. Tighten evenly.", "Reverse: right cord over the middle pair and under the left; left cord behind and up through the right loop. Tighten to finish one square knot.", "Repeat five full square knots. Compare this flat pattern with the twist you get if you repeat only the first half."], "safety": "Secure the work and keep loose cords away from children and pets.", "review": "Can you identify both halves of every square knot?"}, {"id": 7, "name": "Needle felting", "icon": "\u25cf", "group": "Yarn & fiber", "project": "A small wool practice ball", "supplies": "Felting wool; barbed felting needle; dense felting pad; finger guards", "steps": ["Place a small loose wool bundle on the pad. Roll into a loose ball and tuck loose fibers inward.", "Keep the ball on the pad. Insert the needle shallowly and withdraw at the same angle; do not bend or twist the needle.", "Rotate the wool frequently, moving fingers out of the needle path before each series of pokes.", "Add thin layers of wool where needed. Work all sides evenly until it holds its shape.", "Stop before the ball becomes too hard to pierce comfortably. Store the needle in its protective holder."], "safety": "Felting needles are exceptionally sharp and brittle. Use finger guards; never hold wool in your palm while stabbing.", "review": "Does it hold together evenly without loose flaps?"}, {"id": 8, "name": "Paper crafts", "icon": "\u25c7", "group": "Paper & book arts", "project": "An accordion mini-book", "supplies": "Paper; ruler; pencil; glue stick; scrap card for covers", "steps": ["Cut one long paper strip. Mark six equal panels, using a ruler so the folds align.", "Fold at the first mark, then reverse the next fold. Alternate mountain and valley folds along the strip.", "Close the stack and press folds with a smooth blunt tool. Trim uneven edges if necessary.", "Cut two card covers slightly larger than one panel. Glue the first and last panels to the covers.", "Let dry flat. Add a craft observation or small sketch on each panel."], "safety": "Cut on a protected surface; keep blades capped when not in use.", "review": "Does the book open freely and close squarely?"}, {"id": 9, "name": "Bookbinding", "icon": "\u25a4", "group": "Paper & book arts", "project": "A three-hole pamphlet", "supplies": "Four folded paper sheets; folded card cover; awl; thick needle; thread; scrap cardboard", "steps": ["Nest the folded pages inside the cover. Mark three holes on the fold: center and one near each end.", "Open the booklet on scrap cardboard. Pierce the marks carefully through all layers with an awl.", "Thread a needle with about three booklet heights of thread. Sew from inside through the center, leaving a tail.", "Sew into a top hole, out the bottom hole through the inside fold, then back into the center from outside.", "Tie the two ends around the long interior stitch, making sure one tail sits on each side of it. Trim tails."], "safety": "Pierce into scrap board with hands clear of the awl.", "review": "Can you turn every page without thread loosening?"}, {"id": 10, "name": "Clay & pottery", "icon": "\u25d2", "group": "Clay & sculpture", "project": "An air-dry pinch bowl", "supplies": "Air-dry craft clay; work mat; water cup; wooden tool", "steps": ["Read the clay package instructions. Knead a palm-sized piece and roll into a smooth ball.", "Press your thumb into the center, stopping well above the base.", "Rotate slowly while pinching between thumb and fingers. Aim for even walls around 6\u20138 mm thick.", "Smooth cracks with a barely damp finger. Flatten the base gently and refine the rim.", "Dry according to the manufacturer\u2019s directions, turning only once firm enough. Decorate with compatible materials after fully dry."], "safety": "Air-dry craft clay is decorative, not food-safe or watertight. Wet-clean dust; never sand dry clay indoors.", "review": "Are the walls even and the base stable?"}, {"id": 11, "name": "Jewelry & beading", "icon": "\u2727", "group": "Beads & accessories", "project": "A stretch bead bracelet", "supplies": "Beads; suitable stretch jewelry cord; ruler; scissors; compatible jewelry adhesive if recommended", "steps": ["Measure your wrist and arrange enough beads to fit with a little comfort allowance.", "Cut cord with generous tails and gently pre-stretch if the manufacturer recommends it.", "Thread beads, keeping a clip on the loose end so they cannot spill.", "Check fit before tying. Use a surgeon\u2019s knot: double pass through the first overhand knot, tighten, then secure with a second overhand knot.", "Follow the cord maker\u2019s instructions for adhesive, curing and trimming. Hide the knot inside a large-hole bead if possible."], "safety": "Beads are choking hazards. Keep them away from young children and pets; check metal allergy information.", "review": "Does the bracelet fit comfortably and survive a gentle pull?"}, {"id": 12, "name": "Basketry", "icon": "\u25b1", "group": "Natural & recycled", "project": "A paper-strip basket", "supplies": "Paper strips of equal width; glue; clips; scissors", "steps": ["Lay five strips function makerHome(){const c=craftState(),complete=Object.values(c.work).filter(w=>w.complete).length;$('#view').innerHTML=`<section class="craft-hero"><div><div class="label">TEMPLAR’S PERSONAL MAKER STUDIO</div><h1>A whole world.<br><em>Made by hand.</em></h1><p>Thread your needle. Pick up your hook. Bring your ideas to life. This is your space to practice crafts, build your craft skills, and make something that feels like you.</p><div class="actions"><button onclick="go('crafts')">Find my next craft →</button><button class="secondary" onclick="go('practice')">Plan today’s practice</button></div></div><div class="craft-art" role="img" aria-label="Decorative symbols for scissors, yarn and needlework"><div class="spool">✂ ⌁ ✳</div><p>A little thread.<br>A little patience.<br>Endless possibility.</p></div></section><div class="craft-stats"><article><strong>${CRAFTS.length}</strong>crafts to explore</article><article><strong>${complete}</strong>starter projects completed</article><article><strong>${craftMinutes()}</strong>minutes of practice logged</article></div><div class="craft-tags"><span>Sewing</span><span>Knitting</span><span>Crochet</span><span>Paper, clay & more</span></div><div class="section-title"><h2>Make this studio yours.</h2><span>Choose a small next step</span></div><div class="grid"><article class="card"><span class="icon">✂</span><h3>The craft library</h3><p>Sixteen hands-on starter projects with supplies, step-by-step instructions and a finish check.</p><button onclick="go('crafts')">Explore the library →</button></article><article class="card"><span class="icon">◷</span><h3>Your daily practice room</h3><p>Choose a craft, make a focused practice plan, and record the techniques you want to improve.</p><button onclick="go('practice')">Start a practice session →</button></article><article class="card"><span class="icon">♡</span><h3>Your maker journey</h3><p>Save project notes, record practice sessions and build a personal collection of what you’ve learned.</p><button onclick="go('journal')">Open maker journal →</button></article></div><section class="strip"><div><strong>One craft. One small step. Every day.</strong><p>Build confidence through repetition, reflect on your finish, and return to any project when you want to improve.</p></div><button class="secondary" onclick="go('passport')">My skill passport →</button></section><p class="small">Progress and notes save in this browser. Export a studio backup from your maker journal to keep a copy.</p>`}
function craftLibrary(){ $('#view').innerHTML=head('THE CRAFT LIBRARY','Follow your curiosity.','Choose a craft, gather a few supplies, and start with one real practice piece. Every starter includes five steps and a self-review.')+`<div class="craft-filters"><label>Find a craft or project<input id="craftSearch" type="search" placeholder="Try crochet, yarn, or pouch"></label><label>Craft family<select id="craftFamily"><option value="">All craft families</option>${[...new Set(CRAFTS.map(c=>c.group))].map(g=>`<option>${esc(g)}</option>`).join('')}</select></label></div><p id="craftCount" role="status" class="small"></p><div id="craftResults" class="grid"></div>`;$('#craftSearch').oninput=filterCrafts;$('#craftFamily').onchange=filterCrafts;filterCrafts()}
function filterCrafts(){const q=$('#craftSearch').value.toLowerCase(),g=$('#craftFamily').value;const found=CRAFTS.filter(c=>(!g||c.group===g)&&[c.name,c.project,c.supplies].join(' ').toLowerCase().includes(q));$('#craftCount').textContent=found.length+' crafts found';$('#craftResults').innerHTML=found.map(c=>`<article class="card"><span class="icon">${c.icon}</span><div class="label">${esc(c.group)} ${workFor(c.id).complete?'· COMPLETE':''}</div><h3>${esc(c.name)}</h3><p>${esc(c.project)}</p><p class="craft-meta">Beginner · 5 practical steps · work at your pace</p><button onclick="openCraft(${c.id})">${workFor(c.id).checks.some(Boolean)?'Continue project':'Start learning'} →</button></article>`).join('')||'<div class="empty">No matching crafts. Try another word or craft family.</div>'}
function openCraft(id){const c=CRAFTS[id],w=workFor(id);if(!c)return;clearInterval(tick);page='crafts';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='crafts'));$('#view').innerHTML=head(c.name+' · STARTER PROJECT',c.project,'Read all steps before starting. Take your time, repeat tricky movements, and use your notes to record what changed.')+`<div class="craft-detail"><section class="craft-supply"><h2>Gather your supplies</h2><ul>${c.supplies.split(';').map(s=>`<li>${esc(s.trim())}</li>`).join('')}</ul><h3>Before you begin</h3><p>${esc(c.safety)}</p><p class="small">Use scraps for your first attempt. Finished size and time vary with materials and experience.</p><button class="secondary" onclick="window.print()">Print project sheet</button></section><article class="lesson-body" style="margin:0"><h2>Your five steps</h2><p class="small">Check each step after practicing it. Checks and notes save as you go.</p><div class="craft-steps">${c.steps.map((s,i)=>`<label class="${w.checks[i]?'done':''}"><input type="checkbox" ${w.checks[i]?'checked':''} onchange="craftCheck(${id},${i},this)"><span><strong>Step ${i+1}.</strong> ${esc(s)}</span></label>`).join('')}</div><h3>Check your finished piece</h3><p>${esc(c.review)}</p><label>Project notes<textarea class="craft-note" id="craftNotes" placeholder="What worked? What will I try differently?" oninput="workFor(${id}).notes=this.value;persist()">${esc(w.notes)}</textarea></label><div class="actions"><button onclick="finishCraft(${id})">${w.complete?'Project completed ✓':'Mark project complete'}</button><button class="secondary" onclick="go('crafts')">Back to craft library</button></div><p id="craftFeedback" role="status"></p><div class="actions"><button class="secondary" onclick="practiceFor(${id})">Log this practice</button></div></article></div>`;window.scrollTo(0,0);persist()}

function practiceRoom(){const c=craftState(),cutoff=Date.now()-7*86400000,week=c.sessions.filter(s=>Date.parse(s.date)>=cutoff).reduce((n,s)=>n+s.minutes,0);$('#view').innerHTML=head('DAILY PRACTICE ROOM','Show up. Try something. Grow.','Build a routine that fits your life. Pick a focus, practice away from the screen, then log what you learned.')+`<div class="strip"><div><strong>${week} / ${c.weeklyGoal||180} minutes in the last 7 days</strong><p>Every focused session counts. Take regular hand, eye and shoulder breaks.</p></div></div><div class="craft-detail" style="margin-top:25px"><section class="card"><h2>Today’s focus</h2><label>Skill<select id="practiceSkill">${CRAFTS.map(c=>c.name).map(n=>`<option ${n===practiceChoice?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Session plan<select id="practicePlan"><option value="15">15 minutes · one technique</option><option value="30">30 minutes · sampler practice</option><option value="60">60 minutes · project session</option></select></label><button style="margin-top:20px" onclick="makePracticePlan()">Build my practice plan</button><div id="practicePlanText" role="status"></div></section><form class="lesson-body" style="margin:0" id="practiceForm"><h2>Record a session</h2><label>Actual minutes<input id="practiceMinutes" type="number" min="1" max="1440" required value="15"></label><label>What did you practice or improve?<textarea id="practiceReflection" required maxlength="4000" placeholder="I practiced keeping my stitches even…"></textarea></label><button type="submit" style="margin-top:18px">Save practice session</button><p id="practiceSaved" role="status"></p></form></div><div class="actions"><label>My weekly goal in minutes<input type="number" id="weeklyGoal" min="15" max="10080" value="${c.weeklyGoal||180}"></label><button class="secondary" onclick="saveCraftGoal()">Save weekly goal</button></div>`;$('#practiceForm').onsubmit=e=>{e.preventDefault();const minutes=Number($('#practiceMinutes').value),note=$('#practiceReflection').value.trim();if(!Number.isInteger(minutes)||minutes<1||minutes>1440||!note)return;const skill=$('#practiceSkill').value;craftState().sessions.unshift({id:Date.now(),date:new Date().toISOString(),skill,minutes,note});persist();$('#practiceReflection').value='';$('#practiceSaved').textContent=minutes+' minutes of '+skill+' saved in your journal.';toast('Practice saved')};$('#practicePlan').onchange=()=>$('#practiceMinutes').value=$('#practicePlan').value}
function makePracticePlan(){const name=$('#practiceSkill').value,mins=Number($('#practicePlan').value),c=CRAFTS.find(c=>c.name===name);$('#practiceMinutes').value=mins;$('#practicePlanText').innerHTML=`<div class="feedback"><strong>${mins}-minute ${esc(name)} session</strong><ol><li>Prepare your tools and a clear work surface.</li><li>Repeat one step from “${esc(c.project)}” until the movement feels more familiar.</li><li>Inspect the result, tidy up, and record one thing to try next.</li></ol><button class="secondary" onclick="openCraft(${c.id})">Open instructions</button></div>`}

function projectPlanner(){state.planner=state.planner||[];$('#view').innerHTML=head('THE PROJECT PLANNER','Give your next idea a home.','Plan your own craft projects alongside the guided lessons. Keep the scope small enough to finish, then grow from there.')+`<details class="card"><summary><strong>＋ Plan a new project</strong></summary><form id="plannerForm" class="grand-form"><label>Project name<input id="projectName" required maxlength="120" placeholder="My first patchwork cushion"></label><label>Craft<select id="projectCraft">${CRAFTS.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><label>Materials and plan<textarea id="projectPlan" maxlength="5000" placeholder="Fabric scraps, thread… What will I make, and what is my first step?"></textarea></label><label>Optional target date<input id="projectDate" type="date"></label><button type="submit">Add to my project bench</button></form></details><h2>My project bench</h2><div class="planner-list">${state.planner.map((p,i)=>`<article class="card"><div class="project-heading"><div><div class="label">${esc(p.craft)} · ${esc(p.status)}</div><h3>${esc(p.name)}</h3></div><label>Status<select onchange="state.planner[${i}].status=this.value;persist();projectPlanner()">${['Idea','In progress','Paused','Finished'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label></div><p class="small">${p.date?'Target: '+esc(p.date):'No deadline. Work at your pace.'}</p><label>Materials, plan & next steps<textarea oninput="state.planner[${i}].plan=this.value;persist()" maxlength="5000">${esc(p.plan)}</textarea></label><div class="actions"><button class="secondary" onclick="practiceFor(${Math.max(0,CRAFTS.findIndex(c=>c.name===p.craft))})">Practice this craft</button><button class="secondary" onclick="deleteProject(${i})">Delete project</button></div></article>`).join('')||'<div class="empty"><h3>Make space for your next idea.</h3><p>Use “Plan a new project” to start your personal project be const TERMS=[['Backstitch','A strong hand stitch that doubles back into the previous stitch end before moving forward. Useful for seams and embroidered outlines.'],['Running stitch','An in-and-out stitch along a line. Keep the stitch length and gaps even; use it to practice control or gather fabric.'],['Seam allowance','The distance between a fabric’s cut edge and its stitching line. Follow the pattern’s allowance and keep it consistent.'],['Grainline','The direction of woven fabric threads. A pattern’s grainline usually aligns parallel to the fabric selvage unless instructed otherwise.'],['Right sides together','Place the intended outer faces of fabric against one another before sewing. Turn after stitching to hide seam allowances inside.'],['Gauge / tension','The number of stitches and rows in a measured area. Make and measure a sample in the specified stitch before a size-dependent project.'],['Cast on / bind off','Cast on creates the starting knitting loops; bind off secures the final row so it does not unravel. Keep both edges comfortably loose.'],['Knit stitch','Insert into the front of the next stitch, wrap working yarn, draw a new loop through, and slide the old stitch off. See the knitting starter for practice.'],['Single crochet · US','Insert hook, yarn over and pull up a loop, yarn over and pull through both loops. Called double crochet in UK terminology.'],['Slip stitch · crochet','Insert hook, yarn over, and pull through both the stitch and the loop on the hook in one movement. Often used to join rounds.'],['Turning chain','Chain stitches used when moving to a new crochet row. Whether they count as a stitch depends on the pattern; read its notes.'],['Blocking','Shaping a finished yarn piece with moisture or steam appropriate to the fiber. Follow yarn care instructions; do not apply direct heat to heat-sensitive fibers.'],['Warp / weft','Warp strands run lengthwise on a loom; weft travels across and interlaces with them. Avoid pulling weft so tightly that the edges draw inward.'],['Square knot','A macramé knot made from two opposing half knots around filler cords. Repeating only one half produces a twist.'],['Satin stitch','Parallel embroidery stitches placed closely together to fill a small shape. Avoid pulling so hard that the fabric puckers.'],['Scoring / folding','A light indentation guides an accurate paper fold. Use a blunt scoring tool and a ruler on a protected surface.'],['Clay drying','Dry according to the clay maker’s instructions. Air-dry craft clay is decorative; it is not a substitute for fired, food-safe ceramics.'],['A thoughtful finish','Secure ends, inspect joins, clean up edges, and test gently for the object’s intended use. Record one thing you would improve next time.']];
