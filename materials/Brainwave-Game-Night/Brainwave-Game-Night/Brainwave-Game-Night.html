:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#0b1730}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,#233a6b 0,transparent 35%),#0b1730;min-height:100vh}button,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:18px max(20px,calc((100vw - 1180px)/2));background:#101f3d;border-bottom:1px solid #34466a}.brand{font-size:1.3rem;font-weight:900;letter-spacing:.02em}.brand b{color:#ffcf58}.score{display:flex;gap:.6rem}.score span{background:#253959;padding:.45rem .7rem;border-radius:9px;font-weight:700}main{max-width:1180px;margin:auto;padding:28px 20px 70px}h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.05;margin:0 0 8px}h2{font-size:1.6rem;margin:0 0 10px}p{line-height:1.5}.intro{margin:0 0 24px;color:#b9c8e3}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:23px}.mode{min-height:98px;background:#182d52;border:2px solid #3b527b;color:white;border-radius:15px;text-align:left;padding:13px;font-weight:800;font-size:1rem}.mode small{display:block;color:#becbe2;font-weight:500;margin-top:5px;font-size:.84rem}.mode.active{background:#ffcc57;color:#14213c;border-color:#fff;box-shadow:0 5px 0 #b87d25}.mode.active small{color:#354260}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.pill,.secondary{background:#263a5d;color:white;border:1px solid #567096;border-radius:10px;padding:10px 14px}.pill.active{background:#3d66ac;border-color:#91b9ff}.pill:disabled{opacity:.45;cursor:not-allowed}.stage{background:#142747;border:1px solid #3b557f;border-radius:22px;padding:clamp(20px,4vw,38px);box-shadow:0 20px 45px #050e22aa;min-height:410px}.eyebrow{text-transform:uppercase;color:#ffd15e;letter-spacing:.13em;font-weight:800;font-size:.82rem}.prompt{font-size:clamp(1.35rem,3vw,2.1rem);font-weight:800;margin:12px 0 20px;line-height:1.25}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer,.tile{border:2px solid #4b6693;color:white;background:#213b65;border-radius:12px;min-height:64px;padding:13px;text-align:left;font-weight:700}.answer:hover,.tile:hover,.secondary:hover{border-color:#ffcd58}.answer:disabled,.tile:disabled{cursor:default}.correct{background:#206b5d!important;border-color:#7fefc5!important}.wrong{background:#743e56!important;border-color:#f7a0b6!important}.hint{color:#c1d0eb;margin:16px 0}.feedback{min-height:28px;font-weight:800;color:#ffda81;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary{border:0;background:#ffcd58;color:#17233a;font-weight:900;border-radius:11px;padding:12px 20px}.primary:hover{background:#ffe294}input{border:2px solid #6a87b3;border-radius:10px;padding:13px 15px;background:#0f1f3a;color:white;max-width:100%;width:320px}input::placeholder{color:#aebbd0}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{text-align:center;min-height:90px;background:#264c8a}.tile strong{display:block;font-size:1.3rem;color:#ffdc80}.tile.used{opacity:.42}.letters{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0}.letter{display:grid;place-items:center;min-width:42px;height:55px;padding:0 7px;background:#fff;color:#142441;border-radius:7px;font-size:1.5rem;font-weight:900}.letter.blank{background:#41649a;color:transparent}.chain{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}.chain span{background:#31598e;padding:12px;border-radius:9px;font-weight:800}.wheel{display:flex;gap:7px;flex-wrap:wrap}.wheel button{border:1px solid #7896bd;background:#294773;color:white;padding:10px;min-width:40px;border-radius:8px;font-weight:800}.wheel button:disabled{opacity:.3}.luckBoard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:550px}.luckTile{background:linear-gradient(145deg,#6848a9,#275a9c);border:2px solid #c3a8ff;border-radius:13px;color:#ffe37c;min-height:75px;font-size:1.6rem;font-weight:900}.luckTile small{display:block;color:#fff;font-size:.8rem}.luckTile:disabled{opacity:.55}.showCard{max-width:700px;margin:10px auto;text-align:center;padding:18px}.showIcon{font-size:3.3rem;color:#ffcd58}.showCard h2{font-size:clamp(2rem,5vw,3rem);margin:12px 0}.showCard p{font-size:1.13rem;color:#d3e1f7}.showCard .primary{font-size:1.15rem;padding:16px 28px;margin-top:16px}.timerBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#263b62;border-radius:12px;padding:10px 14px;margin-bottom:23px;font-weight:800}.timerBar strong{font-size:1.5rem;color:#ffdd77;font-variant-numeric:tabular-nums}.timerBar.urgent{background:#783b50;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.7}}.riskStats{display:flex;gap:20px;flex-wrap:wrap;margin:15px 0;font-weight:700}.riskStats strong{color:#ffdb6c;font-size:1.6rem;margin-left:8px}.surveyRow{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;background:#23416b;border-radius:9px;margin:8px 0}.surveyRow strong{color:#ffdd82}.muted{color:#bfd0ec}.turn{font-weight:800;color:#ffdc7d}@media(max-width:760px){.modes{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.score{flex-direction:column}.grid,.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.modes{grid-template-columns:1fr 1fr}.mode{min-height:82px;font-size:.88rem}.stage{min-height:440px}.letter{min-width:32px;height:45px;font-size:1.2rem}}

const historicalWings=[{"id": "wing1", "name": "Civil Rights Movement", "icon": "✊🏾", "color": "#7041ba", "source": "https://www.nps.gov/subjects/civilrights/index.htm", "topics": [{"title": "Segregation", "fact": "Jim Crow laws enforced racial segregation in many U.S. states, especially in the South.", "q": "What did Jim Crow laws enforce?", "a": "Racial segregation", "wrong": ["Voting rights for all", "Free public college", "National parks"]}, {"title": "Brown v. Board", "fact": "In 1954 the U.S. Supreme Court held that racial segregation in public schools was unconstitutional.", "q": "What did Brown v. Board of Education rule in 1954?", "a": "School segregation was unconstitutional", "wrong": ["All schools must close", "Voting age became 18", "Buses became free"]}, {"title": "Montgomery boycott", "fact": "The Montgomery bus boycott began in 1955 after Rosa Parks was arrested for refusing to give up her seat.", "q": "What event helped start the Montgomery bus boycott?", "a": "Rosa Parks's arrest", "wrong": ["The Boston Tea Party", "A presidential election", "The moon landing"]}, {"title": "Little Rock Nine", "fact": "Nine Black students integrated Central High School in Little Rock, Arkansas, in 1957 amid intense opposition.", "q": "Where did the Little Rock Nine integrate a high school?", "a": "Little Rock, Arkansas", "wrong": ["Montgomery, Alabama", "Boston, Massachusetts", "Philadelphia, Pennsylvania"]}, {"title": "Sit-ins", "fact": "In 1960 students held nonviolent sit-ins at segregated lunch counters, including in Greensboro, North Carolina.", "q": "What did the 1960 Greensboro sit-ins challenge?", "a": "Segregated lunch counters", "wrong": ["The space program", "Postal rates", "Agricultural taxes"]}, {"title": "Freedom Rides", "fact": "The Freedom Riders challenged segregation in interstate bus travel in 1961.", "q": "What did the Freedom Rides challenge?", "a": "Segregation in interstate bus travel", "wrong": ["Segregation in the Roman Senate", "The tea tax", "School lunch menus"]}, {"title": "March on Washington", "fact": "The 1963 March on Washington for Jobs and Freedom included Martin Luther King Jr.'s I Have a Dream speech.", "q": "What major event featured King's I Have a Dream speech?", "a": "The 1963 March on Washington", "wrong": ["The 1954 Brown decision", "The 1965 Selma march", "The 1961 Freedom Rides"]}, {"title": "Civil Rights Act", "fact": "The Civil Rights Act of 1964 prohibited discrimination in public accommodations and employment on specified grounds.", "q": "Which law addressed discrimination in public accommodations and employment?", "a": "Civil Rights Act of 1964", "wrong": ["Homestead Act", "Stamp Act", "Northwest Ordinance"]}, {"title": "Selma", "fact": "The 1965 Selma voting-rights marches highlighted barriers facing Black voters.", "q": "What central right did the Selma marches emphasize?", "a": "Voting rights", "wrong": ["Import tariffs", "Military enlistment", "Property taxes"]}, {"title": "Voting Rights Act", "fact": "The Voting Rights Act of 1965 targeted racial discrimination in voting, including literacy tests.", "q": "What was a central aim of the Voting Rights Act of 1965?", "a": "Combat racial discrimination in voting", "wrong": ["Establish segregated schools", "End all federal elections", "Require literacy tests"]}]}, {"id": "wing2", "name": "The Holocaust", "icon": "🕯️", "color": "#8c4267", "source": "https://www.ushmm.org/teach/teaching-materials", "topics": [{"title": "Antisemitism", "fact": "Antisemitism is hostility, prejudice, or discrimination against Jewish people.", "q": "What does antisemitism mean?", "a": "Prejudice against Jewish people", "wrong": ["Protection of religious freedom", "A form of architecture", "A trade agreement"]}, {"title": "Nazi rule", "fact": "Adolf Hitler became German chancellor in 1933 as the Nazi regime dismantled democracy.", "q": "In what year did Hitler become German chancellor?", "a": "1933", "wrong": ["1914", "1945", "1961"]}, {"title": "Nuremberg Laws", "fact": "The Nazi regime's 1935 Nuremberg Laws stripped German Jews of citizenship rights and prohibited certain marriages.", "q": "What did the Nuremberg Laws do?", "a": "Stripped German Jews of rights", "wrong": ["Granted equal citizenship", "Ended World War II", "Founded the United Nations"]}, {"title": "Kristallnacht", "fact": "In November 1938 Nazis and supporters attacked Jewish homes, businesses, and synagogues during Kristallnacht.", "q": "What was Kristallnacht?", "a": "A violent anti-Jewish pogrom in 1938", "wrong": ["A peace treaty", "A rescue operation", "An election"]}, {"title": "Ghettos", "fact": "Nazis forced many Jewish people into overcrowded, confined ghettos, including the Warsaw ghetto.", "q": "Why did Nazis establish ghettos?", "a": "To isolate and confine Jews", "wrong": ["To expand voting rights", "To offer free travel", "To protect religious buildings"]}, {"title": "Invasion of Poland", "fact": "Germany's invasion of Poland in September 1939 began World War II in Europe.", "q": "Which invasion began World War II in Europe in 1939?", "a": "Germany's invasion of Poland", "wrong": ["Italy's invasion of Greece", "Japan's attack on Pearl Harbor", "Germany's invasion of France"]}, {"title": "Mass shootings", "fact": "Mobile Nazi killing units, or Einsatzgruppen, murdered Jews and others in mass shootings.", "q": "What were Einsatzgruppen?", "a": "Mobile Nazi killing units", "wrong": ["Allied relief workers", "Jewish resistance fighters", "Neutral diplomats"]}, {"title": "Death camps", "fact": "Nazi killing centers, including Auschwitz-Birkenau, were built for systematic mass murder.", "q": "What was Auschwitz-Birkenau?", "a": "A Nazi concentration and killing complex", "wrong": ["An Allied headquarters", "A refugee resettlement town", "A postwar courtroom"]}, {"title": "Resistance and rescue", "fact": "Some Jews resisted in ghettos and camps; individuals and networks also risked their lives to rescue persecuted people.", "q": "Which statement about Holocaust-era resistance is accurate?", "a": "People resisted and some rescuers helped", "wrong": ["No one attempted resistance", "All countries offered open refuge", "Every victim survived"]}, {"title": "Liberation and testimony", "fact": "Allied forces liberated camps in 1944–45; survivor testimony and documents remain vital historical evidence.", "q": "Why are survivor testimonies important?", "a": "They preserve firsthand historical evidence", "wrong": ["They replace all other sources", "They prove every rumor", "They are fictional histories"]}]}, {"id": "wing3", "name": "Slavery in America", "icon": "⛓️‍💥", "color": "#ae5639", "source": "https://nmaahc.si.edu/explore/stories/slavery-and-freedom", "topics": [{"title": "Origins", "fact": "English colonists brought captive Africans to Virginia in 1619; hereditary race-based slavery hardened during the 1600s.", "q": "What happened in English Virginia in 1619?", "a": "The arrival of captive Africans", "wrong": ["The passage of the 13th Amendment", "The Civil War ended", "The Boston Tea Party"]}, {"title": "Atlantic trade", "fact": "The transatlantic slave trade forcibly transported millions of Africans across the Atlantic.", "q": "What did the transatlantic slave trade involve?", "a": "Forced transportation of enslaved Africans", "wrong": ["Voluntary tourism", "Free labor contracts", "European pilgrimages"]}, {"title": "Middle Passage", "fact": "The Middle Passage was the brutal ocean crossing endured by captive Africans bound for the Americas.", "q": "What was the Middle Passage?", "a": "The forced Atlantic crossing", "wrong": ["A route across the Rockies", "A railway line", "A Roman trade road"]}, {"title": "Plantation labor", "fact": "Enslaved people labored in fields, homes, trades, docks, and many other settings.", "q": "Where did enslaved people work?", "a": "Across agricultural and skilled occupations", "wrong": ["Only aboard ships", "Only in government", "Only in gold mines"]}, {"title": "Family and culture", "fact": "Enslaved Africans and their descendants maintained family, faith, language, music, and community despite oppression.", "q": "Which statement reflects the lives of enslaved people?", "a": "They sustained families and cultural traditions", "wrong": ["They had no community ties", "They were all taught to read freely", "They all lived identical lives"]}, {"title": "Resistance", "fact": "Resistance included preserving culture, escaping, work slowdowns, and organized revolts.", "q": "Which was a form of resistance to slavery?", "a": "Escape and other acts of resistance", "wrong": ["A royal coronation", "A tea boycott in London", "A Roman census"]}, {"title": "Abolitionists", "fact": "Frederick Douglass and Harriet Tubman were important leaders in the struggle against slavery.", "q": "Who were Frederick Douglass and Harriet Tubman?", "a": "Antislavery leaders", "wrong": ["Roman emperors", "English monarchs", "Colonial tax collectors"]}, {"title": "Underground Railroad", "fact": "The Underground Railroad was a network of people and routes helping enslaved people escape; it was not a literal train.", "q": "What was the Underground Railroad?", "a": "A secretive escape-support network", "wrong": ["A subway in Boston", "A railroad built in 1619", "A military road"]}, {"title": "Emancipation", "fact": "The Emancipation Proclamation took effect in 1863 and declared freedom for enslaved people in areas in rebellion against the United States.", "q": "What did the 1863 Emancipation Proclamation declare?", "a": "Freedom for enslaved people in rebellious areas", "wrong": ["Immediate freedom everywhere worldwide", "An end to voting", "The creation of the colonies"]}, {"title": "13th Amendment", "fact": "Ratified in 1865, the 13th Amendment abolished slavery and involuntary servitude except as punishment for a crime.", "q": "What did the 13th Amendment abolish?", "a": "Slavery except the constitutional punishment exception", "wrong": ["The Senate", "All forms of imprisonment", "Public education"]}]}, {"id": "wing4", "name": "Boston Tea Party", "icon": "🫖", "color": "#247e91", "source": "https://www.nps.gov/bost/learn/historyculture/index.htm", "topics": [{"title": "British debt", "fact": "After the Seven Years' War Britain sought new revenue from its North American colonies.", "q": "Why did Britain seek more colonial revenue after 1763?", "a": "War debt and imperial costs", "wrong": ["To fund Roman armies", "To buy the Nile", "To finance the moon landing"]}, {"title": "Stamp Act", "fact": "The 1765 Stamp Act placed taxes on many printed materials in the colonies.", "q": "What did the Stamp Act tax?", "a": "Printed materials", "wrong": ["Tea alone", "Only sugarcane", "All ocean travel"]}, {"title": "Representation", "fact": "Many colonists objected to parliamentary taxation without elected colonial representation in Parliament.", "q": "What did 'no taxation without representation' protest?", "a": "Taxes without colonial representation in Parliament", "wrong": ["The Roman Senate", "Women's suffrage in 1920", "The abolition of slavery"]}, {"title": "Townshend Acts", "fact": "The Townshend Acts taxed imports including tea and prompted colonial boycotts.", "q": "Which imported commodity was taxed under the Townshend Acts?", "a": "Tea", "wrong": ["Petroleum", "Automobiles", "Cotton candy"]}, {"title": "Boston Massacre", "fact": "British soldiers killed five civilians during the 1770 Boston Massacre; opposing accounts shaped public reaction.", "q": "In what year did the Boston Massacre occur?", "a": "1770", "wrong": ["1607", "1776", "1865"]}, {"title": "Tea Act", "fact": "The Tea Act of 1773 favored the East India Company's tea trade while retaining a disputed tea duty.", "q": "Which company benefited from the Tea Act?", "a": "East India Company", "wrong": ["Hudson's Bay Company", "Dutch West India Company", "Virginia Company"]}, {"title": "Tea protest", "fact": "On December 16, 1773, protesters dumped tea from British ships into Boston Harbor.", "q": "When did the Boston Tea Party occur?", "a": "December 16, 1773", "wrong": ["July 4, 1776", "April 19, 1775", "November 11, 1918"]}, {"title": "Mohawk disguises", "fact": "Some Tea Party participants wore disguises evoking Mohawk identity; this did not mean Mohawk people organized the protest.", "q": "Which statement about Tea Party disguises is accurate?", "a": "Some protesters used Mohawk-inspired disguises", "wrong": ["Mohawk leaders planned the protest", "All protesters wore British uniforms", "No one concealed an identity"]}, {"title": "Coercive Acts", "fact": "Britain responded with punitive Coercive Acts, called the Intolerable Acts by many colonists.", "q": "How did Parliament respond to the Tea Party?", "a": "Punitive Coercive Acts", "wrong": ["It repealed every tax", "It granted independence", "It ended the monarchy"]}, {"title": "First Continental Congress", "fact": "Delegates from 12 colonies met at the First Continental Congress in 1774 to coordinate a response.", "q": "What met in 1774 after the Coercive Acts?", "a": "The First Continental Congress", "wrong": ["The Constitutional Convention", "The United Nations", "The Roman Senate"]}]}, {"id": "wing5", "name": "Julius Caesar & Ancient Rome", "icon": "🏛️", "color": "#6150ab", "source": "https://www.britannica.com/biography/Julius-Caesar-Roman-ruler", "topics": [{"title": "Republic", "fact": "Before Caesar's dictatorship, Rome was a republic with elected magistrates and an influential Senate.", "q": "What form of government preceded Caesar's dictatorship?", "a": "The Roman Republic", "wrong": ["The Byzantine Empire", "The British Parliament", "The Egyptian Old Kingdom"]}, {"title": "Consuls", "fact": "Two consuls were elected annually as senior magistrates during much of the Roman Republic.", "q": "How many consuls normally served together in the Republic?", "a": "Two", "wrong": ["One", "Five", "Ten"]}, {"title": "First Triumvirate", "fact": "Caesar formed an informal political alliance with Pompey and Crassus, often called the First Triumvirate.", "q": "Who joined Caesar in the First Triumvirate?", "a": "Pompey and Crassus", "wrong": ["Augustus and Nero", "Hannibal and Scipio", "Plato and Aristotle"]}, {"title": "Gaul", "fact": "Caesar led campaigns in Gaul from 58 to 50 BCE, expanding Roman control at immense human cost.", "q": "Where did Caesar wage major campaigns from 58 to 50 BCE?", "a": "Gaul", "wrong": ["The Americas", "Japan", "The Nile Delta"]}, {"title": "Rubicon", "fact": "In 49 BCE Caesar crossed the Rubicon with his army, helping trigger civil war.", "q": "Why was Caesar's crossing of the Rubicon significant?", "a": "It helped trigger a Roman civil war", "wrong": ["It founded Rome", "It ended the Punic Wars", "It built the Colosseum"]}, {"title": "Pompey", "fact": "Caesar defeated Pompey's forces at Pharsalus in 48 BCE.", "q": "Whom did Caesar defeat at Pharsalus?", "a": "Pompey's forces", "wrong": ["Cleopatra's navy", "Hannibal's army", "The Etruscan kings"]}, {"title": "Cleopatra", "fact": "Caesar became involved in Egyptian politics and allied with Cleopatra VII.", "q": "Which Egyptian ruler allied with Caesar?", "a": "Cleopatra VII", "wrong": ["Hatshepsut", "Nefertiti", "Boudica"]}, {"title": "Dictator", "fact": "Caesar was named dictator for life in 44 BCE, alarming opponents who feared monarchy.", "q": "What title did Caesar receive in 44 BCE?", "a": "Dictator for life", "wrong": ["First pope", "King of Gaul", "Tribune for life"]}, {"title": "Ides of March", "fact": "A group of senators assassinated Caesar on March 15, 44 BCE, the Ides of March.", "q": "What happened on the Ides of March, 44 BCE?", "a": "Caesar was assassinated", "wrong": ["Rome was founded", "The empire fell", "The Punic Wars began"]}, {"title": "Augustus", "fact": "After further civil wars Octavian, later Augustus, became Rome's first emperor in 27 BCE.", "q": "Who became Rome's first emperor in 27 BCE?", "a": "Augustus", "wrong": ["Julius Caesar", "Cicero", "Pompey"]}]}, {"id": "wing6", "name": "Black Inventors & Heroes", "icon": "💡", "color": "#9b5c21", "source": "https://www.uspto.gov/learning-and-resources/journeys-innovation/black-innovation", "topics": [{"title": "Thomas Jennings", "fact": "Thomas Jennings became the first known Black American to receive a U.S. patent in 1821 for a dry-scouring process.", "q": "Who patented a dry-scouring process in 1821?", "a": "Thomas Jennings", "wrong": ["George Washington Carver", "Garrett Morgan", "Lewis Latimer"]}, {"title": "Lewis Latimer", "fact": "Lewis Latimer helped develop and improve carbon filaments and worked in electric-lighting industries; he did not invent the light bulb.", "q": "What was Lewis Latimer known for?", "a": "Important work on electric-lighting technology", "wrong": ["Inventing the entire electric grid alone", "Discovering penicillin", "Inventing the telephone"]}, {"title": "Garrett Morgan", "fact": "Garrett Morgan patented a protective breathing device and a three-position traffic signal.", "q": "What invention is associated with Garrett Morgan?", "a": "A three-position traffic signal", "wrong": ["The first automobile", "The internet", "The cotton gin"]}, {"title": "Madam C. J. Walker", "fact": "Madam C. J. Walker built a major hair-care enterprise and supported Black women's economic opportunity.", "q": "What industry was Madam C. J. Walker associated with?", "a": "Hair care and entrepreneurship", "wrong": ["Aircraft engines", "Ocean navigation", "Roman architecture"]}, {"title": "George Washington Carver", "fact": "George Washington Carver advanced agricultural education, soil improvement, and uses for alternative crops; he did not invent peanut butter.", "q": "What was Carver's major area of work?", "a": "Agricultural research and education", "wrong": ["Inventing peanut butter", "Inventing radio", "Building the first pyramid"]}, {"title": "Bessie Coleman", "fact": "Bessie Coleman became the first African American woman to earn a pilot's license in 1921, training in France.", "q": "Who was Bessie Coleman?", "a": "A pioneering aviator", "wrong": ["A Roman senator", "A colonial printer", "A Nobel-winning chemist"]}, {"title": "Katherine Johnson", "fact": "NASA mathematician Katherine Johnson calculated trajectories supporting major U.S. space missions.", "q": "What was Katherine Johnson's field?", "a": "Mathematics for spaceflight", "wrong": ["Ancient history", "Marine biology", "Architecture"]}, {"title": "Mary Jackson", "fact": "Mary W. Jackson became NASA's first Black female engineer in 1958.", "q": "What milestone did Mary W. Jackson reach?", "a": "NASA's first Black female engineer", "wrong": ["First woman in space", "Inventor of GPS", "First U.S. president"]}, {"title": "Charles Drew", "fact": "Physician Charles Drew pioneered blood plasma preservation and blood-bank organization.", "q": "What field did Charles Drew advance?", "a": "Blood plasma and blood banking", "wrong": ["Telegraphy", "Steam engines", "Astronomy"]}, {"title": "Claim checking", "fact": "Historical credit is often collaborative; verify patent records and primary sources before claiming someone invented a device alone.", "q": "What is the best way to check an invention claim?", "a": "Consult patents and reliable primary sources", "wrong": ["Repeat a viral post", "Assume every single-inventor story is true", "Ignore dates"]}]}, {"id": "wing7", "name": "Columbus & Atlantic Encounters", "icon": "⛵", "color": "#277b70", "source": "https://americanindian.si.edu/nk360", "topics": [{"title": "Indigenous Americas", "fact": "Indigenous peoples had lived throughout the Americas for millennia before Columbus's voyages.", "q": "Who lived in the Americas before Columbus arrived?", "a": "Many Indigenous nations", "wrong": ["No people at all", "Only European settlers", "Only Roman traders"]}, {"title": "1492 voyage", "fact": "Columbus reached islands in the Caribbean in October 1492 while sailing under the Spanish crown.", "q": "Where did Columbus reach land in 1492?", "a": "The Caribbean", "wrong": ["India", "Mainland China", "Australia"]}, {"title": "Sponsorship", "fact": "Isabella I of Castile and Ferdinand II of Aragon backed Columbus's 1492 expedition.", "q": "Which monarchy backed Columbus's voyage?", "a": "The Spanish monarchy", "wrong": ["The Roman Senate", "The English Parliament", "The Ottoman court"]}, {"title": "Navigation", "fact": "Columbus sought a westward sea route to Asia, but his voyages connected Europe with lands already inhabited in the Americas.", "q": "What route was Columbus seeking?", "a": "A westward route to Asia", "wrong": ["A land route across Africa", "A route to the Moon", "A Nile canal"]}, {"title": "Taíno", "fact": "Columbus's expeditions encountered Taíno communities in the Caribbean.", "q": "Which Indigenous people did Columbus encounter in the Caribbean?", "a": "Taíno", "wrong": ["Inca of Peru", "Inuit of Greenland", "Maori of Aotearoa"]}, {"title": "Colonization", "fact": "Subsequent Spanish colonization brought forced labor, violence, dispossession, and major disruption to Indigenous communities.", "q": "Which was a consequence of Spanish colonization?", "a": "Forced labor and Indigenous dispossession", "wrong": ["An immediate end to all conflict", "Equal rights for all communities", "No demographic changes"]}, {"title": "Disease", "fact": "Diseases introduced from Afro-Eurasia caused devastating epidemics among Indigenous populations.", "q": "What had devastating demographic effects after transatlantic contact?", "a": "Introduced diseases", "wrong": ["Only colder winters", "Roman taxation", "Steam power"]}, {"title": "Columbian Exchange", "fact": "The Columbian Exchange moved plants, animals, diseases, and peoples between the Eastern and Western Hemispheres.", "q": "What was the Columbian Exchange?", "a": "Transatlantic movement of crops, animals, disease, and people", "wrong": ["A Roman treaty", "A modern currency market", "A Boston protest"]}, {"title": "Enslavement", "fact": "Colonial empires enslaved Indigenous people, and the Atlantic slave trade later expanded forced African labor.", "q": "Which labor system spread during colonial expansion?", "a": "Coerced and enslaved labor", "wrong": ["Universal paid vacation", "Abolition of all taxes", "Universal suffrage"]}, {"title": "Historical perspectives", "fact": "Accounts of 1492 differ depending on whose experiences are centered; Indigenous testimony and archaeology are essential sources.", "q": "What sources help recover Indigenous perspectives on 1492?", "a": "Indigenous histories and archaeology", "wrong": ["Only royal proclamations", "Only modern movies", "Only Columbus's own words"]}]}, {"id": "wing8", "name": "13 Colonies & First Thanksgiving", "icon": "🌽", "color": "#ac6630", "source": "https://americanindian.si.edu/nk360/resources/Do-You-Know-the-Real-Story-of-Thanksgiving", "topics": [{"title": "Jamestown", "fact": "Jamestown was founded in Virginia in 1607 as the first permanent English settlement in what became the United States.", "q": "When was Jamestown founded?", "a": "1607", "wrong": ["1492", "1620", "1776"]}, {"title": "Plymouth", "fact": "English settlers aboard the Mayflower established Plymouth Colony in 1620.", "q": "What colony did the Mayflower settlers establish?", "a": "Plymouth", "wrong": ["Jamestown", "Georgia", "New Amsterdam"]}, {"title": "Wampanoag", "fact": "Wampanoag people had lived in southeastern New England long before English colonial settlement.", "q": "Who already lived near Plymouth?", "a": "Wampanoag communities", "wrong": ["Uninhabited wilderness", "Roman legionaries", "Dutch royalty"]}, {"title": "1621 gathering", "fact": "A 1621 harvest gathering at Plymouth involved English colonists and Wampanoag participants; its details are incompletely recorded.", "q": "Who participated in the 1621 Plymouth harvest gathering?", "a": "English colonists and Wampanoag people", "wrong": ["All 13 colonies", "Only English monarchs", "Roman soldiers"]}, {"title": "Ousamequin", "fact": "Ousamequin (Massasoit), a Wampanoag leader, negotiated a diplomatic alliance with Plymouth colonists in 1621.", "q": "Who was Ousamequin?", "a": "A Wampanoag leader who made an alliance with Plymouth", "wrong": ["Captain of the Mayflower", "Governor of Georgia", "A Roman emperor"]}, {"title": "Tisquantum", "fact": "Tisquantum (Squanto), a Patuxet man who had survived enslavement abroad, helped Plymouth colonists communicate and cultivate crops.", "q": "Who was Tisquantum?", "a": "A Patuxet interpreter and agricultural guide", "wrong": ["An English king", "A Boston tax official", "A Spanish explorer"]}, {"title": "Regional colonies", "fact": "The thirteen British colonies developed distinct New England, Middle, and Southern regional economies and societies.", "q": "How are the thirteen colonies commonly grouped?", "a": "New England, Middle, and Southern", "wrong": ["Eastern and Western only", "Roman and Greek", "Coastal and Arctic"]}, {"title": "Colonial labor", "fact": "Colonial economies relied on different labor systems, including indentured servitude and increasingly racialized chattel slavery.", "q": "Which labor systems shaped colonial economies?", "a": "Indentured servitude and slavery", "wrong": ["Only salaried factory work", "Only Roman serfdom", "No labor migration"]}, {"title": "Colonial conflict", "fact": "English settler expansion and land disputes contributed to devastating conflicts with Indigenous nations.", "q": "What contributed to conflicts between colonists and Indigenous peoples?", "a": "Land dispossession and settler expansion", "wrong": ["The construction of railroads", "The abolition of tea", "An astronaut landing"]}, {"title": "Thanksgiving myths", "fact": "The 1621 gathering was not the origin of every Thanksgiving tradition, and later colonization brought displacement and warfare.", "q": "Which claim about the 'first Thanksgiving' is most accurate?", "a": "It is one documented 1621 gathering, not the whole story", "wrong": ["It ended all colonial conflicts", "Everyone ate modern Thanksgiving food", "All thirteen colonies attended"]}]}, {"id": "wing9", "name": "Reconstruction", "icon": "📜", "color": "#4b6f9c", "source": "https://www.nps.gov/subjects/reconstruction/index.htm", "topics": [{"title": "1865", "fact": "Reconstruction followed the U.S. Civil War and addressed reunification, freedom, citizenship, and political power.", "q": "What period followed the Civil War?", "a": "Reconstruction", "wrong": ["The Gilded Age alone", "The New Deal", "The Roman Republic"]}, {"title": "Freedmen's Bureau", "fact": "Established in 1865, the Freedmen's Bureau supported education and relief for formerly enslaved people and others.", "q": "What did the Freedmen's Bureau help provide?", "a": "Education and relief", "wrong": ["Only naval ships", "Only tea imports", "Only foreign treaties"]}, {"title": "Black Codes", "fact": "Southern Black Codes sought to restrict the freedom and labor of formerly enslaved Black people after the war.", "q": "What was the effect of Black Codes?", "a": "Restricted Black freedom and labor", "wrong": ["Guaranteed full equality", "Ended all discrimination", "Funded every school equally"]}, {"title": "14th Amendment", "fact": "Ratified in 1868, the 14th Amendment established birthright citizenship and equal protection under the law.", "q": "What does the 14th Amendment include?", "a": "Citizenship and equal protection", "wrong": ["A nationwide alcohol ban", "A tax on tea", "A ban on all immigration"]}, {"title": "15th Amendment", "fact": "Ratified in 1870, the 15th Amendment barred denying voting rights based on race, color, or previous condition of servitude.", "q": "What did the 15th Amendment prohibit?", "a": "Race-based voting denial", "wrong": ["All voting restrictions", "Voting by women nationwide", "All property taxes"]}, {"title": "Black officeholders", "fact": "During Reconstruction Black Americans voted and held local, state, and national offices, including in Congress.", "q": "What political milestone occurred during Reconstruction?", "a": "Black Americans elected to public office", "wrong": ["The Senate was abolished", "All former Confederates lost citizenship", "Women universally gained the vote"]}, {"title": "Schools and institutions", "fact": "Black communities founded schools, churches, mutual-aid networks, and civic institutions.", "q": "What did freed communities build?", "a": "Schools and civic institutions", "wrong": ["Only plantations", "Only military barracks", "Only railroads"]}, {"title": "White supremacist terror", "fact": "Groups such as the Ku Klux Klan used violence and intimidation to undermine Black political participation.", "q": "What did the Ku Klux Klan use to suppress Black political power?", "a": "Violence and intimidation", "wrong": ["Peaceful school debates", "Election assistance", "Universal scholarships"]}, {"title": "1877 withdrawal", "fact": "A political settlement following the disputed 1876 election led to withdrawal of remaining federal troops from the South in 1877.", "q": "What happened in 1877 as Reconstruction ended?", "a": "Remaining federal troops withdrew from the South", "wrong": ["The Civil War began", "The Constitution was written", "The colonies declared independence"]}, {"title": "Long legacy", "fact": "The rollback of Reconstruction rights and rise of Jim Crow shaped later civil-rights struggles.", "q": "What later struggle was shaped by Reconstruction's unfinished promises?", "a": "The Civil Rights Movement", "wrong": ["The Punic Wars", "The First Crusade", "The French Revolution"]}]}, {"id": "wing10", "name": "Ancient Egypt & the Nile", "icon": "🏺", "color": "#8b6651", "source": "https://www.metmuseum.org/toah/hd/egyp/hd_egyp.htm", "topics": [{"title": "Nile River", "fact": "The Nile's annual flood historically deposited fertile silt that supported farming along its banks.", "q": "Why was the Nile important to ancient Egyptian agriculture?", "a": "Its floods deposited fertile silt", "wrong": ["It froze every winter", "It supplied coal", "It eliminated all drought"]}, {"title": "Upper and Lower Egypt", "fact": "Upper Egypt lay upstream in the south; Lower Egypt occupied the northern Nile Delta.", "q": "Where was Lower Egypt?", "a": "The northern Nile Delta", "wrong": ["Southern Nubia", "The Arabian Peninsula", "The Sahara's far west"]}, {"title": "Unification", "fact": "Egyptian tradition associates early unification with a king often called Narmer, around 3100 BCE.", "q": "Who is associated with early Egyptian unification?", "a": "Narmer", "wrong": ["Julius Caesar", "Ramses XI alone", "Alexander Hamilton"]}, {"title": "Pharaoh", "fact": "Pharaohs were kings who exercised political and religious authority in ancient Egypt.", "q": "What was a pharaoh?", "a": "A ruler of ancient Egypt", "wrong": ["A Roman elected consul", "A colonial governor", "A Greek merchant"]}, {"title": "Hieroglyphs", "fact": "Egyptian hieroglyphic writing combined signs representing sounds, words, and ideas.", "q": "What did Egyptian hieroglyphs represent?", "a": "Sounds, words, and ideas", "wrong": ["Only modern numbers", "Only musical notes", "Only Roman laws"]}, {"title": "Pyramids", "fact": "The pyramids at Giza were royal tomb monuments built during Egypt's Old Kingdom.", "q": "Why were the Giza pyramids built?", "a": "As royal tomb monuments", "wrong": ["As modern museums", "As Roman forts", "As grain ships"]}, {"title": "Hatshepsut", "fact": "Hatshepsut ruled as a pharaoh during the New Kingdom and sponsored major building and trade projects.", "q": "Who was Hatshepsut?", "a": "A woman who ruled as pharaoh", "wrong": ["A Roman consul", "A Greek philosopher", "A Wampanoag leader"]}, {"title": "Akhenaten", "fact": "Akhenaten promoted worship of the Aten and reshaped Egyptian religious life during his reign.", "q": "What deity did Akhenaten especially promote?", "a": "Aten", "wrong": ["Jupiter", "Zeus", "Odin"]}, {"title": "Rosetta Stone", "fact": "The Rosetta Stone's parallel inscriptions helped scholars decipher Egyptian hieroglyphs in the 1800s.", "q": "Why is the Rosetta Stone important?", "a": "It helped decipher hieroglyphs", "wrong": ["It built the pyramids", "It ended Roman rule", "It mapped the Atlantic"]}, {"title": "Egyptian daily life", "fact": "Ancient Egyptian society included farmers, craftspeople, scribes, merchants, and builders beyond its famous rulers.", "q": "Which people made up daily life in ancient Egypt?", "a": "Farmers, scribes, craftspeople, and others", "wrong": ["Only pharaohs", "Only soldiers", "Only pyramid architects"]}]}];for(const w of historicalWings)for(const t of w.topics){quiz.push({cat:w.name,q:t.q,a:[t.a,...t.wrong],right:0,points:200});finalQs.push({q:t.q,a:[t.a,...t.wrong],right:0});phrases.push({phrase:t.title.toUpperCase().replace(/[^A-Z ]/g,''),category:w.name});for(const word of (t.title.toUpperCase().match(/\b[A-Z]{5}\b/g)||[]))words.push({word,hint:w.name+': '+t.fact});}

unt. You get 3 misses.</p><form id="surveyForm"><input id="entry" autocomplete="off" placeholder="Your answer" aria-label="Your answer"><button class="primary">Guess</button></form><div id="reveals">${x.answers.map((a,i)=>`<div class="surveyRow"><span>${surveyFound.has(i)||done?escapeHtml(a[0]):'???'}</span><strong>${surveyFound.has(i)||done?a[1]+' points':'?'}</strong></div>`).join('')}</div><p class="muted">Misses: ${surveyTries}/3</p><div class="feedback" id="feedback"></div>${controls()}`}else if(mode==='quiz'){h=`<div class="eyebrow">Category board</div><div class="prompt">Choose a subject and point value.</div><div class="board">${quiz.map((q,i)=>`<button class="tile ${used.has(i)?'used':''}" data-q="${i}" ${used.has(i)?'disabled':''}>${q.cat}<strong>${q.points}</strong></button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" id="newBoard">Clear board</button></div>`}else if(mode==='lingo'){let x=words[idx.lingo];h=`<div class="roundBadge">Puzzle ${idx.lingo+1} of ${words.length}</div><div class="eyebrow">Word clues · five letters</div><div class="prompt">${x.hint}</div><p class="hint">Guess the word in up to 5 tries. Green = right place; gold = in the word.</p><form id="wordForm"><input id="entry" maxlength="5" autocomplete="off" placeholder="Five-letter word" aria-label="Five-letter word"><button class="primary">Check</button></form><div id="history">${lingoHistory.map(row=>`<p>${row}</p>`).join('')}</div><div class="feedback" id="feedback"></div>${controls()}`}else if(mode==='chain'){let x=chains[idx.chain];h=`<div class="roundBadge">Chain ${idx.chain+1} of ${chains.length}</div><div class="eyebrow">Word links · ${chainStep}/3 complete</div><div class="miniProgress"><span style="width:${chainStep/3*100}%"></span></div><div class="prompt">Complete the chain of related words.</div><div class="chain"><span>${x.start}</span><b>→</b>${x.links.map((w,i)=>`<span>${i<chainStep?w:'?'}</span><b>→</b>`).join(' function wire(){let n=$('next');if(n)n.onclick=next;if(mode==='survey')$('surveyForm').onsubmit=e=>{e.preventDefault();if(done)return;let val=$('entry').value.trim().toLowerCase().replace(/[^a-z]/g,'');let x=surveys[idx.survey],i=x.answers.findIndex(([a])=>{let t=a.toLowerCase().replace(/[^a-z]/g,'');return val===t||val.length>3&&(t.includes(val)||val.includes(t))});if(i>=0&&!surveyFound.has(i)){surveyFound.add(i);score(x.answers[i][1]);if(surveyFound.size===5)done=true;render();feedback(done?'All answers found!':'Great answer!')}else{surveyTries++;if(surveyTries>=3)done=true;render();feedback(done?'Round over. The remaining answers are revealed.':i>=0?'Already found. Try another.':'Not on this board. Try another.')}$('entry')?.focus()};if(mode==='quiz'){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>question(+b.dataset.q));$('newBoard').onclick=()=>{used.clear();render()}}if(mode==='lingo')$('wordForm').onsubmit=e=>{e.preventDefault();if(done)return;let val=$('entry').value.trim().toUpperCase();if(!/^[A-Z]{5}$/.test(val)){feedback('Enter exactly five letters.');return}let x=words[idx.lingo].word;lingoTries++;let result=[...val].map((c,i)=>c===x[i]?'🟩':x.includes(c)?'🟨':'⬛').join('');lingoHistory.push(val+'  '+result);render();if(val===x){score(Math.max(20,120-lingoTries*20));done=true;feedback('You found it!')}else if(lingoTries>=5){done=true;feedback('The word was '+x+'.')}else feedback((5-lingoTries)+' guesses left.');$('entry').value='';$('entry').focus()};if(mode==='chain')$('chainForm').onsubmit=e=>{e.preventDefault();if(done)return;let val=$('entry').value.trim().toUpperCase();if(val===chains[idx.chain].links[chainStep]){score(30);chainStep++;if(chainStep===3)done=true;render();feedback(done?'Chain complete!':'Nice link!');if(!done)$('entry').focus()}else{feedback('Try again. Use the clue.');$('entry').select()}};if(mode==='price')$('priceForm').onsubmit=e=>{e.preventDefault();if(done)return;let n=Number($('entry').value),x=prices[idx.price].p '||guesses.has(c))||wheelTries>=5)done=true;render();feedback(done?(wheelTries>=5?'The phrase was '+x+'.':'Phrase complete!'):x.includes(c)?'Good pick!':'No '+c+' this time.')});$('solveForm').onsubmit=e=>{e.preventDefault();if(done)return;let val=$('entry').value.trim().toUpperCase().replace(/\s+/g,' '),x=phrases[idx.wheel].phrase;if(val===x){score(100);done=true;render();feedback('Solved! +100 points')}else feedback('Not quite. Keep trying!')}}}
function question(i){let q=quiz[i];$('stage').innerHTML=timerHtml()+`<div class="eyebrow">${q.cat} · ${q.points} points</div><div class="prompt">${q.q}</div><div class="grid">${q.a.map((a,j)=>`<button class="answer" data-a="${j}">${escapeHtml(a)}</button>`).join('')}</div><div class="feedback" id="feedback"></div>${controls()}`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(used.has(i))return;used.add(i);let right=+b.dataset.a===q.right;if(right)score(q.points);document.querySelectorAll('[data-a]').forEach(v=>{v.disabled=true;if(+v.dataset.a===q.right)v.classList.add('correct');else if(v===b)v.classList.add('wrong')});feedback(right?'Correct! +'+q.points+' points':'The answer is '+q.a[q.right]+'.')});$('next').onclick=render}
$('modes').innerHTML=games.map(([key,name,sub])=>`<button class="mode" data-mode="${key}">${name}<small>${sub}</small></button>`).join('');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>select(b.dataset.mode));$('teamBtn').onclick=()=>{team=1-team;render()};$('resetBtn').onclick=()=>{scores=[0,0];score(0)};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',soundOn)};render();
