<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Talent Show Kit</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3f365a,#111827 60%);color:#faf5eb;font:16px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:25px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.08 Georgia;color:#f3ce86;margin:5px 0}h2{font:700 1.7rem Georgia;color:#f3ce86}h3{color:#f3ce86}.panel{background:#24273a;border:1px solid #887d90;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#cecbd8}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{background:#edc273;color:#261e30;border:0;border-radius:10px;padding:11px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ee5e6}.secondary{background:#55506a;color:white}textarea,input,select{width:100%;padding:12px;border:1px solid #a69bb0;border-radius:9px;background:#151626;color:white;font:inherit}textarea{min-height:150px;resize:vertical}.card{border-left:3px solid #eac476;padding:12px 14px;background:#313248;margin:10px 0}.hidden{display:none}.badge{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#f7d995;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.feedback{background:#314d4c;padding:14px;border-radius:10px;white-space:pre-line}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101625;border-radius:9px;padding:13px}label{display:block;margin:9px 0;font-weight:700}</style></head><body><main><header class="panel"><div class="badge">Templar's Brand Builder Collection</div><h1>Family Talent Show Kit</h1><p>Build a running order, spin 20 performance challenges, choose awards, and save your favorite moments.</p></header><section class="panel"><h2>Plan the show</h2><label>Performer or group name<input id="performer" placeholder="Auntie Templar and the crew"></label><button id="add">Add to running order</button><button class="secondary" id="clear">Clear running order</button><ol id="order"></ol></section><section class="panel"><h2>Challenge wheel</h2><p id="challenge" class="card">Spin for a surprise act.</p><button id="spin">🎲 Spin for act</button><button id="award" class="secondary">🏆 Pick an award</button><p id="awardText"></p><label>Show notes<textarea id="notes" placeholder="Favorite moments, scores, winners..."></textarea></label><button id="download">Download running order and notes</button></section></main><script>const acts=["Sing an original chorus", "Tell a funny family memory", "Perform a silent charade", "Dance for 30 seconds", "Imitate an animal", "Read an original poem", "Make up a commercial for a household object", "Perform a duet", "Tell a two-minute fairy tale", "Invent a holiday jingle", "Do a magic trick with a coin", "Share a compliment for someone in the room", "Perform a dramatic weather report", "Make up a superhero origin", "Act out a scene using three random objects", "Lead a family singalong", "Create a thirty-second rap about dinner", "Tell a joke with a surprising ending", "Perform a scene from a made-up movie", "Show a skill you have practiced"];const awards=["Best Storyteller", "Biggest Laugh", "Most Creative Act", "Heart of the Night", "Showstopper", "Bravest Performer", "Best Teamwork", "Audience Favorite"];(()=>{let $=q=>document.querySelector(q),key="templar-talent-v1",state={order:[],notes:""};try{state={...state,...JSON.parse(localStorage.getItem(key))}}catch{}function save(){state.notes=$("#notes").value;localStorage.setItem(key,JSON.stringify(state));render()}function render(){$("#order").innerHTML="";state.order.forEach((x,i)=>{let li=document.createElement("li");li.textContent=x+" ";let b=document.createElement("button");b.textContent="Remove";b.className="secondary";b.onclick=()=>{state.order.splice(i,1);save()};li.append(b);$("#order").append(li)})}$("#notes").value=state.notes;$("#notes").oninput=save;$("#add").onclick=()=>{let v=$("#performer").value.trim();if(!v)return;state.order.push(v);$("#performer").value="";save()};$("#clear").onclick=()=>{if(confirm("Clear the running order?")){state.order=[];save()}};$("#spin").onclick=()=>$("#challenge").textContent=acts[Math.floor(Math.random()*acts.length)];$("#award").onclick=()=>$("#awardText").textContent="Award idea: "+awards[Math.floor(Math.random()*awards.length)];$("#download").onclick=()=>{let t="FAMILY TALENT SHOW\n\nRunning order:\n"+state.order.map((x,i)=>(i+1)+". "+x).join("\n")+"\n\nShow notes:\n"+$("#notes").value,a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="Family_Talent_Show_Program.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
