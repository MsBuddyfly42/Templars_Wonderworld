<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Time Capsule</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a3c64,#13182a 58%);color:#fbf6ed;font:16px/1.55 system-ui}main{max-width:950px;margin:auto;padding:24px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.05 Georgia;color:#f5d38e;margin:7px 0}h2{font:700 1.7rem Georgia;color:#f5d38e}.panel{background:#25283b;border:1px solid #95869e;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#d5cadb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;background:#ebc478;color:#251d2b;padding:12px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93f0ed}.secondary{background:#514c68;color:white}textarea,input,select{background:#171827;color:white;border:1px solid #aaa0af;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:125px}.card{background:#35344d;border-left:3px solid #f5d38e;padding:13px;margin:9px 0}.badge{color:#e9d19c;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:800}.hidden{display:none}.status{background:#30504e;padding:12px;border-radius:10px}.big{font:700 1.25rem/1.6 Georgia;white-space:pre-line}</style></head><body><main><header class="panel"><div class="badge">Templar’s six new adventures</div><h1>Family Time Capsule</h1><p>Thirty thoughtful prompts to preserve memories, laughter, songs, and family traditions.</p></header><section class="panel"><h2>Family time capsule</h2><p>Pass the computer around or interview someone. Keep a copy by downloading when you finish.</p><label>Who is sharing?<input id="person" placeholder="Name or nickname"></label><div id="questions"></div><button id="download">⬇ Download our time capsule</button><button id="print" class="secondary">Print</button><button id="clear" class="secondary">Clear answers</button><p id="status"></p></section></main><script>(()=>{let $=q=>document.querySelector(q),qs=['What made you laugh this year?','What is one family tradition you want to keep?','What was a meal you loved sharing?','Which song reminds you of this season?','What is a skill you learned or practiced?','What story about your childhood should we remember?','Who helped you this year, and how?','What are you proud of?','What would you tell your future self?','What would you like to do together next year?','Which family recipe should we preserve?','Who taught you a useful lesson?','What is a place that feels like home?','What is your favorite holiday memory?','What is one thing that surprised you this year?','What game did you enjoy as a child?','What is a family saying you remember?','What would you put in a box for future generations?','What family photo has a story behind it?','Which person do you wish we could ask more questions?','What has changed for the better?','What was the funniest small moment?','Which smell reminds you of childhood?','What song should we play at the next gathering?','What do you hope the children remember?','What was a time the family helped each other?','What place would you like us all to visit?','What is a dream you have not given up?','What advice would you give a younger relative?','What question should we add to this capsule?'];let key='templar-family-capsule-v1',state={person:'',answers:[]};try{state={...state,...JSON.parse(localStorage.getItem(key))}}catch{}$('#person').value=state.person;qs.forEach((q,i)=>{let l=document.createElement('label');l.textContent=(i+1)+'. '+q;let t=document.createElement('textarea');t.value=state.answers[i]||'';t.dataset.i=i;t.oninput=save;l.append(t);$('#questions').append(l)});function save(){state.person=$('#person').value;state.answers=[...document.querySelectorAll('#questions textarea')].map(x=>x.value);localStorage.setItem(key,JSON.stringify(state));$('#status').textContent='Saved in this browser.'}$('#person').oninput=save;$('#download').onclick=()=>{save();let t='FAMILY TIME CAPSULE — '+(state.person||'Our family')+'\nDate: '+new Date().toLocaleDateString()+'\n\n'+qs.map((q,i)=>q+'\n'+(state.answers[i]||'')).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='Family_Time_Capsule.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#print').onclick=()=>window.print();$('#clear').onclick=()=>{if(confirm('Clear all answers on this computer?')){state={person:'',answers:[]};$('#person').value='';document.querySelectorAll('#questions textarea').forEach(t=>t.value='');save()}}})();</script></body></html>
