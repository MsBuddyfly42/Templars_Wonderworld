<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make-Believe Town Builder</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a3c64,#13182a 58%);color:#fbf6ed;font:16px/1.55 system-ui}main{max-width:950px;margin:auto;padding:24px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.05 Georgia;color:#f5d38e;margin:7px 0}h2{font:700 1.7rem Georgia;color:#f5d38e}.panel{background:#25283b;border:1px solid #95869e;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#d5cadb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;background:#ebc478;color:#251d2b;padding:12px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93f0ed}.secondary{background:#514c68;color:white}textarea,input,select{background:#171827;color:white;border:1px solid #aaa0af;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:125px}.card{background:#35344d;border-left:3px solid #f5d38e;padding:13px;margin:9px 0}.badge{color:#e9d19c;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:800}.hidden{display:none}.status{background:#30504e;padding:12px;border-radius:10px}.big{font:700 1.25rem/1.6 Georgia;white-space:pre-line}</style></head><body><main><header class="panel"><div class="badge">Templar’s six new adventures</div><h1>Make-Believe Town Builder</h1><p>Spend a 300-coin budget on places that bring joy and connection, then save your town story.</p></header><section class="panel"><h2>Your town</h2><label>Town name<input id="name" value="Golden Grove"></label><div class="row"><span>Budget: <strong id="budget">300</strong></span><span>Joy: <strong id="joy">0</strong></span><span>Community: <strong id="community">0</strong></span></div><p>Choose places to build. Your choices shape the story of the town.</p><div id="buildings" class="grid"></div><h3>Town map</h3><div id="map" class="card"></div><div id="story" class="card"></div><button id="export">Download town story</button><button id="reset" class="secondary">Start a new town</button></section></main><script>(()=>{let $=q=>document.querySelector(q),items=[['Library',20,5,15,'Neighbors swap stories and discover new ideas.'],['Music Hall',25,16,4,'A choir fills the evenings with song.'],['Garden',15,8,12,'Families grow food and flowers together.'],['Playground',18,14,7,'Children turn an empty lot into laughter.'],['Cafe',22,10,8,'Friends meet over warm drinks.'],['Workshop',28,4,15,'Makers teach neighbors to repair and build.'],['Theater',30,18,5,'Actors perform stories from every generation.'],['Market',24,9,11,'Small sellers share their craft.'],['Clinic',28,4,18,'Care is closer to home.'],['Museum',20,7,11,'The town preserves its stories.'],['River Walk',16,10,7,'Neighbors gather by the water.'],['School',30,5,20,'Young minds find new teachers.'],['Bakery',19,12,5,'Fresh bread draws people together.'],['Sports Field',22,13,7,'Teams cheer one another on.'],['Community Center',27,12,16,'Meetings and celebrations share a home.'],['Bookshop',18,8,9,'Readers trade recommendations.'],['Art Studio',23,14,6,'Color fills the town.'],['Fire Station',31,3,18,'Prepared neighbors protect each other.'],['Bus Stop',12,4,12,'People reach more opportunities.'],['Small Park',15,11,8,'Trees shade an afternoon walk.']];let s={name:'Golden Grove',budget:300,joy:0,community:0,placed:[]};function render(){s.name=$('#name').value||'Your town';$('#budget').textContent=s.budget;$('#joy').textContent=s.joy;$('#community').textContent=s.community;$('#map').textContent=s.placed.length?s.placed.map(x=>x[0]).join(' • '):'An open field awaits.';$('#story').textContent=s.placed.length?s.name+' grows: '+s.placed.map(x=>x[4]).join(' '):'Choose your first building.'}items.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[0]+' • '+x[1]+' coins';b.onclick=()=>{if(s.placed.some(y=>y[0]===x[0])){alert('You already built that place.');return}if(s.budget<x[1]){alert('Not enough coins. Choose another place.');return}s.budget-=x[1];s.joy+=x[2];s.community+=x[3];s.placed.push(x);render()};$('#buildings').append(b)});$('#name').oninput=render;$('#reset').onclick=()=>{if(confirm('Start over with 300 coins?')){s={name:'',budget:300,joy:0,community:0,placed:[]};render()}};$('#export').onclick=()=>{render();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s.name+'\nBudget left: '+s.budget+'; Joy: '+s.joy+'; Community: '+s.community+'\n\n'+$('#story').textContent],{type:'text/plain'}));a.download='My_Make_Believe_Town.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
