<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Quest</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a3c64,#13182a 58%);color:#fbf6ed;font:16px/1.55 system-ui}main{max-width:950px;margin:auto;padding:24px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.05 Georgia;color:#f5d38e;margin:7px 0}h2{font:700 1.7rem Georgia;color:#f5d38e}.panel{background:#25283b;border:1px solid #95869e;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#d5cadb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;background:#ebc478;color:#251d2b;padding:12px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93f0ed}.secondary{background:#514c68;color:white}textarea,input,select{background:#171827;color:white;border:1px solid #aaa0af;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:125px}.card{background:#35344d;border-left:3px solid #f5d38e;padding:13px;margin:9px 0}.badge{color:#e9d19c;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:800}.hidden{display:none}.status{background:#30504e;padding:12px;border-radius:10px}.big{font:700 1.25rem/1.6 Georgia;white-space:pre-line}</style></head><body><main><header class="panel"><div class="badge">Templar’s six new adventures</div><h1>Career Quest</h1><p>An interactive twenty-step adventure about searching, interviewing, solving problems, and planning work around your business.</p></header><section class="panel"><div class="row"><span id="stage">Step 1 of 6</span><span>Confidence points: <strong id="points">0</strong></span></div><h2 id="title"></h2><p id="scenario" class="big"></p><div id="choices" class="grid"></div><div id="feedback" class="status hidden"></div><button id="restart" class="secondary">Restart quest</button><button id="export" class="secondary">Download reflection</button></section></main><script>(()=>{let $=q=>document.querySelector(q),steps=[['Choose your direction','You want a role that uses your office and computer skills while you build a business. What is your first move?',[['Search office support and help desk roles',2],['Apply to every unrelated role without reading it',0],['Wait for an employer to call',0]],'A focused search gives you better leads.'],['Read the posting','A job asks for customer service, Excel, and clear writing. What should your resume emphasize?',[['Relevant examples of those skills',2],['Only an unrelated hobby',0],['A long list of every tool ever made',1]],'Match your real experience to the stated work.'],['Prepare your story','An interviewer asks why you are returning to coding. What is the strongest answer?',[['Describe your degree, current practice, and a project',2],['Say you have forgotten everything',0],['Change the subject',0]],'Concrete examples show both experience and momentum.'],['Handle a tech question','A computer is slow. What do you do first?',[['Ask when it started and what changed',2],['Erase all files',0],['Promise a new computer',0]],'Diagnose before changing things.'],['Evaluate the offer','The schedule conflicts with a family commitment. What is the right next step?',[['Ask about the schedule before accepting',2],['Accept and hope it changes',0],['Ignore the offer',0]],'Clarify practical conditions before committing.'],['Plan the transition','You have a job and S3LFM@DE Solutions is preparing to open. How do you manage both?',[['Set realistic hours and keep business commitments clear',2],['Promise both sides unlimited time',0],['Stop tracking deadlines',0]],'A sustainable plan protects your work and family time.'],['Follow up','You applied for a role a week ago. What is a reasonable next move?',[['Send a brief polite follow-up through the listed channel',2],['Send ten messages in one day',0],['Assume you failed',0]],'Professional follow-up can show interest without pressure.'],['Prepare examples','An interview asks for a time you solved a problem. How do you respond?',[['Give a specific situation, action, and result',2],['Say you always solve everything',0],['Avoid the question',0]],'Specific examples are memorable.'],['Technical honesty','You do not know one software tool in the posting. What do you say?',[['Be honest and show how you learn new tools',2],['Claim expert knowledge',0],['Refuse to learn it',0]],'Honesty plus learning ability builds trust.'],['Customer empathy','A caller is upset about a delay. What is your first response?',[['Listen, acknowledge the issue, and gather facts',2],['Blame the caller',0],['Promise a fix without checking',0]],'Calm listening helps you diagnose accurately.'],['Prioritize tickets','Three support requests arrive together. What do you do?',[['Assess urgency and impact, then communicate order',2],['Pick one at random and ignore others',0],['Delete two',0]],'Priority depends on impact and urgency.'],['Protect information','A caller asks for another person’s account details. What is the right choice?',[['Verify authorization and follow policy',2],['Share the details to be helpful',0],['Post the details online',0]],'Privacy and permissions matter.'],['Learn from feedback','A supervisor suggests a clearer way to document cases. What do you do?',[['Try it and ask for an example',2],['Ignore all feedback',0],['Stop documenting',0]],'Feedback can improve consistency.'],['Practice Excel','A role uses spreadsheets. How do you prepare?',[['Practice formulas, sorting, and clean tables',2],['Memorize only the icon color',0],['Avoid spreadsheets',0]],'Hands-on practice is better than guessing.'],['Network locally','You want to learn about an office role at a college. What is useful?',[['Read the career page and attend a relevant event',2],['Demand an offer from a stranger',0],['Share private records publicly',0]],'Respectful research opens doors.'],['Plan your week','A job, family, and study time compete. What helps?',[['Block realistic time and review priorities',2],['Say yes to every task',0],['Never rest',0]],'A workable schedule matters.'],['Build proof','You want to show recent computer skills. What can you bring?',[['A small portfolio and clear explanations',2],['Someone else’s project claimed as yours',0],['Only vague claims',0]],'Show what you built and what you learned.'],['Review an offer','An offer has unclear hours and duties. What next?',[['Ask for details in writing',2],['Guess the terms',0],['Publish the offer online',0]],'Clarity helps you decide.'],['Keep growing','You get the job. How do you keep building skills?',[['Set a modest weekly practice goal',2],['Stop learning immediately',0],['Overload every evening',0]],'Sustainable progress adds up.'],['Celebrate progress','You reach a milestone. What should you do?',[['Note what worked and celebrate with your people',2],['Dismiss it entirely',0],['Pretend nothing happened',0]],'Remembering progress helps you keep going.']];let i=0,points=0,log=[];function show(){if(i>=steps.length){$('#stage').textContent='Quest complete';$('#title').textContent='Your next chapter';$('#scenario').textContent='You earned '+points+' of 12 confidence points. Every choice helped you practice your plan.';$('#choices').innerHTML='';return}let s=steps[i];$('#stage').textContent='Step '+(i+1)+' of '+steps.length;$('#points').textContent=points;$('#title').textContent=s[0];$('#scenario').textContent=s[1];$('#choices').innerHTML='';$('#feedback').classList.add('hidden');s[2].forEach(([label,value])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{points+=value;log.push(s[0]+': '+label+' — '+s[3]);$('#feedback').textContent=s[3]+' +'+value+' points';$('#feedback').classList.remove('hidden');$('#choices').innerHTML='';let next=document.createElement('button');next.textContent='Continue';next.onclick=()=>{i++;show()};$('#choices').append(next)};$('#choices').append(b)})}$('#restart').onclick=()=>{i=0;points=0;log=[];show()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['CAREER QUEST REFLECTION\nScore: '+points+' / 12\n\n'+log.join('\n\n')],{type:'text/plain'}));a.download='Career_Quest_Reflection.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};show()})();</script></body></html>
