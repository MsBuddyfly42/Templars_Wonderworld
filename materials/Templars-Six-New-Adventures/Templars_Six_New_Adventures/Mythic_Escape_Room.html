<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythic Escape Room</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a3c64,#13182a 58%);color:#fbf6ed;font:16px/1.55 system-ui}main{max-width:950px;margin:auto;padding:24px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.05 Georgia;color:#f5d38e;margin:7px 0}h2{font:700 1.7rem Georgia;color:#f5d38e}.panel{background:#25283b;border:1px solid #95869e;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#d5cadb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;background:#ebc478;color:#251d2b;padding:12px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93f0ed}.secondary{background:#514c68;color:white}textarea,input,select{background:#171827;color:white;border:1px solid #aaa0af;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:125px}.card{background:#35344d;border-left:3px solid #f5d38e;padding:13px;margin:9px 0}.badge{color:#e9d19c;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:800}.hidden{display:none}.status{background:#30504e;padding:12px;border-radius:10px}.big{font:700 1.25rem/1.6 Georgia;white-space:pre-line}</style></head><body><main><header class="panel"><div class="badge">Templar’s six new adventures</div><h1>Mythic Escape Room</h1><p>Fifteen connected puzzle rooms inspired by myths and fairy tales. Solve each lock to reach the final cabinet.</p></header><section class="panel"><div class="row"><strong id="room">Room 1 of 15</strong><span id="keys">🔑 0 keys</span></div><h2 id="title"></h2><p class="big" id="story"></p><div id="objects" class="grid"></div><label>Your answer<input id="answer" placeholder="Type the code or answer"></label><button id="submit">Unlock the door</button><button id="hint" class="secondary">Hint</button><button id="restart" class="secondary">Start again</button><p id="status" role="status"></p></section></main><script>(()=>{let $=q=>document.querySelector(q),rooms=[['The Moon Door','Three lanterns show a crescent, a full moon, and a star. The inscription says: “I grow, then I am whole.” Which lantern opens the door?','FULL MOON','It is the complete phase of the moon.'],['The Sphinx Table','A carving asks: “What has keys but cannot open locks?”','PIANO','It makes music.'],['The Weaver’s Loom','Gold, blue, gold, blue, gold... What color comes next?','BLUE','Look for the repeating two-color pattern.'],['The Clock Gallery','A clock shows 3:00. What number will its hour hand point to after four hours?','7','Count forward four hours.'],['The River Gate','The sign says: “I have a bank, but I hold no money.” What am I?','RIVER','Think of the land beside flowing water.'],['The Phoenix Hall','A bird rises from ashes. What is its name?','PHOENIX','A mythical firebird.'],['The Seven Steps','Count backward three steps from 7.','4','Subtract three.'],['The Crown Riddle','A king can wear me, but I am not a hat.','CROWN','It symbolizes a ruler.'],['The Lantern Code','The lanterns flash red, blue, red, blue. What color is fifth?','RED','The pattern alternates.'],['The Library Shelf','A book has 12 pages. You read 5. How many remain?','7','Subtract what you read.'],['The Garden Gate','I grow from a seed and need light. What am I?','PLANT','It may become a flower or tree.'],['The Echo Chamber','I speak after you speak, but have no mouth.','ECHO','Listen in a canyon.'],['The Star Map','Which direction is opposite north?','SOUTH','Think of a compass.'],['The Hidden Number','Two, four, six, eight. What comes next?','10','Add two each time.'],['The Final Cabinet','The first letter of Moon, Ink, Rose, Rose, Oak, Rose makes the password.','MIRROR','Take the first letter of each word.']];let i=0,keys=0;rooms.push(...[["Civil Rights Movement — Segregation", "What did Jim Crow laws enforce?", "RACIAL SEGREGATION", "Jim Crow laws enforced racial segregation in many U.S. states, especially in the South."], ["Civil Rights Movement — Brown v. Board", "What did Brown v. Board of Education rule in 1954?", "SCHOOL SEGREGATION WAS UNCONSTITUTIONAL", "In 1954 the U.S. Supreme Court held that racial segregation in public schools was unconstitutional."], ["Civil Rights Movement — Montgomery boycott", "What event helped start the Montgomery bus boycott?", "ROSA PARKS'S ARREST", "The Montgomery bus boycott began in 1955 after Rosa Parks was arrested for refusing to give up her seat."], ["Civil Rights Movement — Little Rock Nine", "Where did the Little Rock Nine integrate a high school?", "LITTLE ROCK, ARKANSAS", "Nine Black students integrated Central High School in Little Rock, Arkansas, in 1957 amid intense opposition."], ["Civil Rights Movement — Sit-ins", "What did the 1960 Greensboro sit-ins challenge?", "SEGREGATED LUNCH COUNTERS", "In 1960 students held nonviolent sit-ins at segregated lunch counters, including in Greensboro, North Carolina."], ["Civil Rights Movement — Freedom Rides", "What did the Freedom Rides challenge?", "SEGREGATION IN INTERSTATE BUS TRAVEL", "The Freedom Riders challenged segregation in interstate bus travel in 1961."], ["Civil Rights Movement — March on Washington", "What major event featured King's I Have a Dream speech?", "THE 1963 MARCH ON WASHINGTON", "The 1963 March on Washington for Jobs and Freedom included Martin Luther King Jr.'s I Have a Dream speech."], ["Civil Rights Movement — Civil Rights Act", "Which law addressed discrimination in public accommodations and employment?", "CIVIL RIGHTS ACT OF 1964", "The Civil Rights Act of 1964 prohibited discrimination in public accommodations and employment on specified grounds."], ["Civil Rights Movement — Selma", "What central right did the Selma marches emphasize?", "VOTING RIGHTS", "The 1965 Selma voting-rights marches highlighted barriers facing Black voters."], ["Civil Rights Movement — Voting Rights Act", "What was a central aim of the Voting Rights Act of 1965?", "COMBAT RACIAL DISCRIMINATION IN VOTING", "The Voting Rights Act of 1965 targeted racial discrimination in voting, including literacy tests."], ["The Holocaust — Antisemitism", "What does antisemitism mean?", "PREJUDICE AGAINST JEWISH PEOPLE", "Antisemitism is hostility, prejudice, or discrimination against Jewish people."], ["The Holocaust — Nazi rule", "In what year did Hitler become German chancellor?", "1933", "Adolf Hitler became German chancellor in 1933 as the Nazi regime dismantled democracy."], ["The Holocaust — Nuremberg Laws", "What did the Nuremberg Laws do?", "STRIPPED GERMAN JEWS OF RIGHTS", "The Nazi regime's 1935 Nuremberg Laws stripped German Jews of citizenship rights and prohibited certain marriages."], ["The Holocaust — Kristallnacht", "What was Kristallnacht?", "A VIOLENT ANTI-JEWISH POGROM IN 1938", "In November 1938 Nazis and supporters attacked Jewish homes, businesses, and synagogues during Kristallnacht."], ["The Holocaust — Ghettos", "Why did Nazis establish ghettos?", "TO ISOLATE AND CONFINE JEWS", "Nazis forced many Jewish people into overcrowded, confined ghettos, including the Warsaw ghetto."], ["The Holocaust — Invasion of Poland", "Which invasion began World War II in Europe in 1939?", "GERMANY'S INVASION OF POLAND", "Germany's invasion of Poland in September 1939 began World War II in Europe."], ["The Holocaust — Mass shootings", "What were Einsatzgruppen?", "MOBILE NAZI KILLING UNITS", "Mobile Nazi killing units, or Einsatzgruppen, murdered Jews and others in mass shootings."], ["The Holocaust — Death camps", "What was Auschwitz-Birkenau?", "A NAZI CONCENTRATION AND KILLING COMPLEX", "Nazi killing centers, including Auschwitz-Birkenau, were built for systematic mass murder."], ["The Holocaust — Resistance and rescue", "Which statement about Holocaust-era resistance is accurate?", "PEOPLE RESISTED AND SOME RESCUERS HELPED", "Some Jews resisted in ghettos and camps; individuals and networks also risked their lives to rescue persecuted people."], ["The Holocaust — Liberation and testimony", "Why are survivor testimonies important?", "THEY PRESERVE FIRSTHAND HISTORICAL EVIDENCE", "Allied forces liberated camps in 1944–45; survivor testimony and documents remain vital historical evidence."], ["Slavery in America — Origins", "What happened in English Virginia in 1619?", "THE ARRIVAL OF CAPTIVE AFRICANS", "English colonists brought captive Africans to Virginia in 1619; hereditary race-based slavery hardened during the 1600s."], ["Slavery in America — Atlantic trade", "What did the transatlantic slave trade involve?", "FORCED TRANSPORTATION OF ENSLAVED AFRICANS", "The transatlantic slave trade forcibly transported millions of Africans across the Atlantic."], ["Slavery in America — Middle Passage", "What was the Middle Passage?", "THE FORCED ATLANTIC CROSSING", "The Middle Passage was the brutal ocean crossing endured by captive Africans bound for the Americas."], ["Slavery in America — Plantation labor", "Where did enslaved people work?", "ACROSS AGRICULTURAL AND SKILLED OCCUPATIONS", "Enslaved people labored in fields, homes, trades, docks, and many other settings."], ["Slavery in America — Family and culture", "Which statement reflects the lives of enslaved people?", "THEY SUSTAINED FAMILIES AND CULTURAL TRADITIONS", "Enslaved Africans and their descendants maintained family, faith, language, music, and community despite oppression."], ["Slavery in America — Resistance", "Which was a form of resistance to slavery?", "ESCAPE AND OTHER ACTS OF RESISTANCE", "Resistance included preserving culture, escaping, work slowdowns, and organized revolts."], ["Slavery in America — Abolitionists", "Who were Frederick Douglass and Harriet Tubman?", "ANTISLAVERY LEADERS", "Frederick Douglass and Harriet Tubman were important leaders in the struggle against slavery."], ["Slavery in America — Underground Railroad", "What was the Underground Railroad?", "A SECRETIVE ESCAPE-SUPPORT NETWORK", "The Underground Railroad was a network of people and routes helping enslaved people escape; it was not a literal train."], ["Slavery in America — Emancipation", "What did the 1863 Emancipation Proclamation declare?", "FREEDOM FOR ENSLAVED PEOPLE IN REBELLIOUS AREAS", "The Emancipation Proclamation took effect in 1863 and declared freedom for enslaved people in areas in rebellion against the United States."], ["Slavery in America — 13th Amendment", "What did the 13th Amendment abolish?", "SLAVERY EXCEPT THE CONSTITUTIONAL PUNISHMENT EXCEPTION", "Ratified in 1865, the 13th Amendment abolished slavery and involuntary servitude except as punishment for a crime."], ["Boston Tea Party — British debt", "Why did Britain seek more colonial revenue after 1763?", "WAR DEBT AND IMPERIAL COSTS", "After the Seven Years' War Britain sought new revenue from its North American colonies."], ["Boston Tea Party — Stamp Act", "What did the Stamp Act tax?", "PRINTED MATERIALS", "The 1765 Stamp Act placed taxes on many printed materials in the colonies."], ["Boston Tea Party — Representation", "What did 'no taxation without representation' protest?", "TAXES WITHOUT COLONIAL REPRESENTATION IN PARLIAMENT", "Many colonists objected to parliamentary taxation without elected colonial representation in Parliament."], ["Boston Tea Party — Townshend Acts", "Which imported commodity was taxed under the Townshend Acts?", "TEA", "The Townshend Acts taxed imports including tea and prompted colonial boycotts."], ["Boston Tea Party — Boston Massacre", "In what year did the Boston Massacre occur?", "1770", "British soldiers killed five civilians during the 1770 Boston Massacre; opposing accounts shaped public reaction."], ["Boston Tea Party — Tea Act", "Which company benefited from the Tea Act?", "EAST INDIA COMPANY", "The Tea Act of 1773 favored the East India Company's tea trade while retaining a disputed tea duty."], ["Boston Tea Party — Tea protest", "When did the Boston Tea Party occur?", "DECEMBER 16, 1773", "On December 16, 1773, protesters dumped tea from British ships into Boston Harbor."], ["Boston Tea Party — Mohawk disguises", "Which statement about Tea Party disguises is accurate?", "SOME PROTESTERS USED MOHAWK-INSPIRED DISGUISES", "Some Tea Party participants wore disguises evoking Mohawk identity; this did not mean Mohawk people organized the protest."], ["Boston Tea Party — Coercive Acts", "How did Parliament respond to the Tea Party?", "PUNITIVE COERCIVE ACTS", "Britain responded with punitive Coercive Acts, called the Intolerable Acts by many colonists."], ["Boston Tea Party — First Continental Congress", "What met in 1774 after the Coercive Acts?", "THE FIRST CONTINENTAL CONGRESS", "Delegates from 12 colonies met at the First Continental Congress in 1774 to coordinate a response."], ["Julius Caesar & Ancient Rome — Republic", "What form of government preceded Caesar's dictatorship?", "THE ROMAN REPUBLIC", "Before Caesar's dictatorship, Rome was a republic with elected magistrates and an influential Senate."], ["Julius Caesar & Ancient Rome — Consuls", "How many consuls normally served together in the Republic?", "TWO", "Two consuls were elected annually as senior magistrates during much of the Roman Republic."], ["Julius Caesar & Ancient Rome — First Triumvirate", "Who joined Caesar in the First Triumvirate?", "POMPEY AND CRASSUS", "Caesar formed an informal political alliance with Pompey and Crassus, often called the First Triumvirate."], ["Julius Caesar & Ancient Rome — Gaul", "Where did Caesar wage major campaigns from 58 to 50 BCE?", "GAUL", "Caesar led campaigns in Gaul from 58 to 50 BCE, expanding Roman control at immense human cost."], ["Julius Caesar & Ancient Rome — Rubicon", "Why was Caesar's crossing of the Rubicon significant?", "IT HELPED TRIGGER A ROMAN CIVIL WAR", "In 49 BCE Caesar crossed the Rubicon with his army, helping trigger civil war."], ["Julius Caesar & Ancient Rome — Pompey", "Whom did Caesar defeat at Pharsalus?", "POMPEY'S FORCES", "Caesar defeated Pompey's forces at Pharsalus in 48 BCE."], ["Julius Caesar & Ancient Rome — Cleopatra", "Which Egyptian ruler allied with Caesar?", "CLEOPATRA VII", "Caesar became involved in Egyptian politics and allied with Cleopatra VII."], ["Julius Caesar & Ancient Rome — Dictator", "What title did Caesar receive in 44 BCE?", "DICTATOR FOR LIFE", "Caesar was named dictator for life in 44 BCE, alarming opponents who feared monarchy."], ["Julius Caesar & Ancient Rome — Ides of March", "What happened on the Ides of March, 44 BCE?", "CAESAR WAS ASSASSINATED", "A group of senators assassinated Caesar on March 15, 44 BCE, the Ides of March."], ["Julius Caesar & Ancient Rome — Augustus", "Who became Rome's first emperor in 27 BCE?", "AUGUSTUS", "After further civil wars Octavian, later Augustus, became Rome's first emperor in 27 BCE."], ["Black Inventors & Heroes — Thomas Jennings", "Who patented a dry-scouring process in 1821?", "THOMAS JENNINGS", "Thomas Jennings became the first known Black American to receive a U.S. patent in 1821 for a dry-scouring process."], ["Black Inventors & Heroes — Lewis Latimer", "What was Lewis Latimer known for?", "IMPORTANT WORK ON ELECTRIC-LIGHTING TECHNOLOGY", "Lewis Latimer helped develop and improve carbon filaments and worked in electric-lighting industries; he did not invent the light bulb."], ["Black Inventors & Heroes — Garrett Morgan", "What invention is associated with Garrett Morgan?", "A THREE-POSITION TRAFFIC SIGNAL", "Garrett Morgan patented a protective breathing device and a three-position traffic signal."], ["Black Inventors & Heroes — Madam C. J. Walker", "What industry was Madam C. J. Walker associated with?", "HAIR CARE AND ENTREPRENEURSHIP", "Madam C. J. Walker built a major hair-care enterprise and supported Black women's economic opportunity."], ["Black Inventors & Heroes — George Washington Carver", "What was Carver's major area of work?", "AGRICULTURAL RESEARCH AND EDUCATION", "George Washington Carver advanced agricultural education, soil improvement, and uses for alternative crops; he did not invent peanut butter."], ["Black Inventors & Heroes — Bessie Coleman", "Who was Bessie Coleman?", "A PIONEERING AVIATOR", "Bessie Coleman became the first African American woman to earn a pilot's license in 1921, training in France."], ["Black Inventors & Heroes — Katherine Johnson", "What was Katherine Johnson's field?", "MATHEMATICS FOR SPACEFLIGHT", "NASA mathematician Katherine Johnson calculated trajectories supporting major U.S. space missions."], ["Black Inventors & Heroes — Mary Jackson", "What milestone did Mary W. Jackson reach?", "NASA'S FIRST BLACK FEMALE ENGINEER", "Mary W. Jackson became NASA's first Black female engineer in 1958."], ["Black Inventors & Heroes — Charles Drew", "What field did Charles Drew advance?", "BLOOD PLASMA AND BLOOD BANKING", "Physician Charles Drew pioneered blood plasma preservation and blood-bank organization."], ["Black Inventors & Heroes — Claim checking", "What is the best way to check an invention claim?", "CONSULT PATENTS AND RELIABLE PRIMARY SOURCES", "Historical credit is often collaborative; verify patent records and primary sources before claiming someone invented a device alone."], ["Columbus & Atlantic Encounters — Indigenous Americas", "Who lived in the Americas before Columbus arrived?", "MANY INDIGENOUS NATIONS", "Indigenous peoples had lived throughout the Americas for millennia before Columbus's voyages."], ["Columbus & Atlantic Encounters — 1492 voyage", "Where did Columbus reach land in 1492?", "THE CARIBBEAN", "Columbus reached islands in the Caribbean in October 1492 while sailing under the Spanish crown."], ["Columbus & Atlantic Encounters — Sponsorship", "Which monarchy backed Columbus's voyage?", "THE SPANISH MONARCHY", "Isabella I of Castile and Ferdinand II of Aragon backed Columbus's 1492 expedition."], ["Columbus & Atlantic Encounters — Navigation", "What route was Columbus seeking?", "A WESTWARD ROUTE TO ASIA", "Columbus sought a westward sea route to Asia, but his voyages connected Europe with lands already inhabited in the Americas."], ["Columbus & Atlantic Encounters — Taíno", "Which Indigenous people did Columbus encounter in the Caribbean?", "TAÍNO", "Columbus's expeditions encountered Taíno communities in the Caribbean."], ["Columbus & Atlantic Encounters — Colonization", "Which was a consequence of Spanish colonization?", "FORCED LABOR AND INDIGENOUS DISPOSSESSION", "Subsequent Spanish colonization brought forced labor, violence, dispossession, and major disruption to Indigenous communities."], ["Columbus & Atlantic Encounters — Disease", "What had devastating demographic effects after transatlantic contact?", "INTRODUCED DISEASES", "Diseases introduced from Afro-Eurasia caused devastating epidemics among Indigenous populations."], ["Columbus & Atlantic Encounters — Columbian Exchange", "What was the Columbian Exchange?", "TRANSATLANTIC MOVEMENT OF CROPS, ANIMALS, DISEASE, AND PEOPLE", "The Columbian Exchange moved plants, animals, diseases, and peoples between the Eastern and Western Hemispheres."], ["Columbus & Atlantic Encounters — Enslavement", "Which labor system spread during colonial expansion?", "COERCED AND ENSLAVED LABOR", "Colonial empires enslaved Indigenous people, and the Atlantic slave trade later expanded forced African labor."], ["Columbus & Atlantic Encounters — Historical perspectives", "What sources help recover Indigenous perspectives on 1492?", "INDIGENOUS HISTORIES AND ARCHAEOLOGY", "Accounts of 1492 differ depending on whose experiences are centered; Indigenous testimony and archaeology are essential sources."], ["13 Colonies & First Thanksgiving — Jamestown", "When was Jamestown founded?", "1607", "Jamestown was founded in Virginia in 1607 as the first permanent English settlement in what became the United States."], ["13 Colonies & First Thanksgiving — Plymouth", "What colony did the Mayflower settlers establish?", "PLYMOUTH", "English settlers aboard the Mayflower established Plymouth Colony in 1620."], ["13 Colonies & First Thanksgiving — Wampanoag", "Who already lived near Plymouth?", "WAMPANOAG COMMUNITIES", "Wampanoag people had lived in southeastern New England long before English colonial settlement."], ["13 Colonies & First Thanksgiving — 1621 gathering", "Who participated in the 1621 Plymouth harvest gathering?", "ENGLISH COLONISTS AND WAMPANOAG PEOPLE", "A 1621 harvest gathering at Plymouth involved English colonists and Wampanoag participants; its details are incompletely recorded."], ["13 Colonies & First Thanksgiving — Ousamequin", "Who was Ousamequin?", "A WAMPANOAG LEADER WHO MADE AN ALLIANCE WITH PLYMOUTH", "Ousamequin (Massasoit), a Wampanoag leader, negotiated a diplomatic alliance with Plymouth colonists in 1621."], ["13 Colonies & First Thanksgiving — Tisquantum", "Who was Tisquantum?", "A PATUXET INTERPRETER AND AGRICULTURAL GUIDE", "Tisquantum (Squanto), a Patuxet man who had survived enslavement abroad, helped Plymouth colonists communicate and cultivate crops."], ["13 Colonies & First Thanksgiving — Regional colonies", "How are the thirteen colonies commonly grouped?", "NEW ENGLAND, MIDDLE, AND SOUTHERN", "The thirteen British colonies developed distinct New England, Middle, and Southern regional economies and societies."], ["13 Colonies & First Thanksgiving — Colonial labor", "Which labor systems shaped colonial economies?", "INDENTURED SERVITUDE AND SLAVERY", "Colonial economies relied on different labor systems, including indentured servitude and increasingly racialized chattel slavery."], ["13 Colonies & First Thanksgiving — Colonial conflict", "What contributed to conflicts between colonists and Indigenous peoples?", "LAND DISPOSSESSION AND SETTLER EXPANSION", "English settler expansion and land disputes contributed to devastating conflicts with Indigenous nations."], ["13 Colonies & First Thanksgiving — Thanksgiving myths", "Which claim about the 'first Thanksgiving' is most accurate?", "IT IS ONE DOCUMENTED 1621 GATHERING, NOT THE WHOLE STORY", "The 1621 gathering was not the origin of every Thanksgiving tradition, and later colonization brought displacement and warfare."], ["Reconstruction — 1865", "What period followed the Civil War?", "RECONSTRUCTION", "Reconstruction followed the U.S. Civil War and addressed reunification, freedom, citizenship, and political power."], ["Reconstruction — Freedmen's Bureau", "What did the Freedmen's Bureau help provide?", "EDUCATION AND RELIEF", "Established in 1865, the Freedmen's Bureau supported education and relief for formerly enslaved people and others."], ["Reconstruction — Black Codes", "What was the effect of Black Codes?", "RESTRICTED BLACK FREEDOM AND LABOR", "Southern Black Codes sought to restrict the freedom and labor of formerly enslaved Black people after the war."], ["Reconstruction — 14th Amendment", "What does the 14th Amendment include?", "CITIZENSHIP AND EQUAL PROTECTION", "Ratified in 1868, the 14th Amendment established birthright citizenship and equal protection under the law."], ["Reconstruction — 15th Amendment", "What did the 15th Amendment prohibit?", "RACE-BASED VOTING DENIAL", "Ratified in 1870, the 15th Amendment barred denying voting rights based on race, color, or previous condition of servitude."], ["Reconstruction — Black officeholders", "What political milestone occurred during Reconstruction?", "BLACK AMERICANS ELECTED TO PUBLIC OFFICE", "During Reconstruction Black Americans voted and held local, state, and national offices, including in Congress."], ["Reconstruction — Schools and institutions", "What did freed communities build?", "SCHOOLS AND CIVIC INSTITUTIONS", "Black communities founded schools, churches, mutual-aid networks, and civic institutions."], ["Reconstruction — White supremacist terror", "What did the Ku Klux Klan use to suppress Black political power?", "VIOLENCE AND INTIMIDATION", "Groups such as the Ku Klux Klan used violence and intimidation to undermine Black political participation."], ["Reconstruction — 1877 withdrawal", "What happened in 1877 as Reconstruction ended?", "REMAINING FEDERAL TROOPS WITHDREW FROM THE SOUTH", "A political settlement following the disputed 1876 election led to withdrawal of remaining federal troops from the South in 1877."], ["Reconstruction — Long legacy", "What later struggle was shaped by Reconstruction's unfinished promises?", "THE CIVIL RIGHTS MOVEMENT", "The rollback of Reconstruction rights and rise of Jim Crow shaped later civil-rights struggles."], ["Ancient Egypt & the Nile — Nile River", "Why was the Nile important to ancient Egyptian agriculture?", "ITS FLOODS DEPOSITED FERTILE SILT", "The Nile's annual flood historically deposited fertile silt that supported farming along its banks."], ["Ancient Egypt & the Nile — Upper and Lower Egypt", "Where was Lower Egypt?", "THE NORTHERN NILE DELTA", "Upper Egypt lay upstream in the south; Lower Egypt occupied the northern Nile Delta."], ["Ancient Egypt & the Nile — Unification", "Who is associated with early Egyptian unification?", "NARMER", "Egyptian tradition associates early unification with a king often called Narmer, around 3100 BCE."], ["Ancient Egypt & the Nile — Pharaoh", "What was a pharaoh?", "A RULER OF ANCIENT EGYPT", "Pharaohs were kings who exercised political and religious authority in ancient Egypt."], ["Ancient Egypt & the Nile — Hieroglyphs", "What did Egyptian hieroglyphs represent?", "SOUNDS, WORDS, AND IDEAS", "Egyptian hieroglyphic writing combined signs representing sounds, words, and ideas."], ["Ancient Egypt & the Nile — Pyramids", "Why were the Giza pyramids built?", "AS ROYAL TOMB MONUMENTS", "The pyramids at Giza were royal tomb monuments built during Egypt's Old Kingdom."], ["Ancient Egypt & the Nile — Hatshepsut", "Who was Hatshepsut?", "A WOMAN WHO RULED AS PHARAOH", "Hatshepsut ruled as a pharaoh during the New Kingdom and sponsored major building and trade projects."], ["Ancient Egypt & the Nile — Akhenaten", "What deity did Akhenaten especially promote?", "ATEN", "Akhenaten promoted worship of the Aten and reshaped Egyptian religious life during his reign."], ["Ancient Egypt & the Nile — Rosetta Stone", "Why is the Rosetta Stone important?", "IT HELPED DECIPHER HIEROGLYPHS", "The Rosetta Stone's parallel inscriptions helped scholars decipher Egyptian hieroglyphs in the 1800s."], ["Ancient Egypt & the Nile — Egyptian daily life", "Which people made up daily life in ancient Egypt?", "FARMERS, SCRIBES, CRAFTSPEOPLE, AND OTHERS", "Ancient Egyptian society included farmers, craftspeople, scribes, merchants, and builders beyond its famous rulers."]]);function show(){if(i>=rooms.length){$('#title').textContent='You escaped!';$('#story').textContent='The cabinet opens to a book of stories waiting for their next author. Storybook Detective, that author is you.';$('#objects').innerHTML='';$('#answer').style.display='none';$('#submit').style.display='none';$('#room').textContent='All fifteen rooms cleared';return}let r=rooms[i];$('#room').textContent='Room '+(i+1)+' of '+rooms.length;$('#keys').textContent='🔑 '+keys+' keys';$('#title').textContent=r[0];$('#story').textContent=r[1];$('#answer').value='';$('#status').textContent='';$('#answer').style.display='block';$('#submit').style.display='inline-block'}$('#submit').onclick=()=>{if(i>=rooms.length)return;let a=$('#answer').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),v=rooms[i][2].replace(/[^A-Z0-9]/g,'');if(a===v){i++;keys++;show()}else $('#status').textContent='That door stayed closed. Try another answer or use the hint.'};$('#hint').onclick=()=>$('#status').textContent=rooms[i]?.[3]||'';$('#restart').onclick=()=>{i=0;keys=0;show()};$('#answer').onkeydown=e=>{if(e.key==='Enter')$('#submit').click()};show()})();</script></body></html>
