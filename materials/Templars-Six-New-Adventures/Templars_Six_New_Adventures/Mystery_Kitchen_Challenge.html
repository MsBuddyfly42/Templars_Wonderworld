<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Kitchen Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4a3c64,#13182a 58%);color:#fbf6ed;font:16px/1.55 system-ui}main{max-width:950px;margin:auto;padding:24px 18px 65px}h1{font:700 clamp(2.3rem,6vw,4rem)/1.05 Georgia;color:#f5d38e;margin:7px 0}h2{font:700 1.7rem Georgia;color:#f5d38e}.panel{background:#25283b;border:1px solid #95869e;border-radius:17px;padding:22px;margin:16px 0}.muted{color:#d5cadb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:10px;background:#ebc478;color:#251d2b;padding:12px 15px;font:700 1rem system-ui;cursor:pointer;margin:3px}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #93f0ed}.secondary{background:#514c68;color:white}textarea,input,select{background:#171827;color:white;border:1px solid #aaa0af;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:125px}.card{background:#35344d;border-left:3px solid #f5d38e;padding:13px;margin:9px 0}.badge{color:#e9d19c;text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:800}.hidden{display:none}.status{background:#30504e;padding:12px;border-radius:10px}.big{font:700 1.25rem/1.6 Georgia;white-space:pre-line}</style></head><body><main><header class="panel"><div class="badge">Templar’s six new adventures</div><h1>Mystery Kitchen Challenge</h1><p>Spin 31 ingredient baskets and invent dishes together. You can play without cooking anything.</p></header><section class="panel"><h2>Kitchen challenge</h2><p id="challenge" class="big">Press Spin to get a mystery basket.</p><button id="spin">🍲 Spin mystery basket</button><button id="judge" class="secondary">Reveal judging prompts</button><div id="criteria" class="card hidden"></div><label>Dish name<input id="dish" placeholder="Give your creation a catchy name"></label><label>How would you make it?<textarea id="recipe" placeholder="Describe ingredients, steps, and presentation..."></textarea></label><button id="save">Save idea</button><button id="download" class="secondary">Download recipe ideas</button><div id="saved"></div></section></main><script>(()=>{let $=q=>document.querySelector(q),baskets=[['Sweet potato','Cinnamon','Apple'],['Rice','Bell pepper','Lemon'],['Bread','Cheese','Tomato'],['Oats','Banana','Honey'],['Potato','Onion','Herbs'],['Pasta','Spinach','Garlic'],['Chicken or beans','Orange','Rice'],['Corn','Black beans','Lime'],['Yogurt','Berries','Cereal'],['Pumpkin','Ginger','Bread'],['Carrot','Orange','Rice'],['Peanut butter','Banana','Oats'],['Mushroom','Garlic','Pasta'],['Apple','Cheese','Bread'],['Corn','Lime','Potato'],['Beans','Tomato','Cumin'],['Rice','Coconut','Pineapple'],['Egg','Spinach','Cheese'],['Tortilla','Beans','Pepper'],['Cucumber','Yogurt','Mint'],['Chicken or tofu','Honey','Lemon'],['Pasta','Tomato','Basil'],['Sweet potato','Black beans','Corn'],['Pear','Oats','Cinnamon'],['Bread','Egg','Apple'],['Rice','Peas','Ginger'],['Potato','Cheese','Broccoli'],['Banana','Chocolate','Yogurt'],['Pumpkin','Oats','Maple'],['Carrot','Garlic','Chickpeas']];let index=-1,key='templar-kitchen-v1',ideas=[];try{ideas=JSON.parse(localStorage.getItem(key))||[]}catch{}function render(){$('#saved').innerHTML='';ideas.forEach(x=>{let d=document.createElement('div');d.className='card';d.textContent=x.name+' — '+x.basket;$('#saved').append(d)})}$('#spin').onclick=()=>{index=(index+1)%baskets.length;$('#challenge').textContent='Mystery basket: '+baskets[index].join(' • ')+'\nInvent a dish using all three. Pantry staples are allowed.';$('#criteria').classList.add('hidden')};$('#judge').onclick=()=>{$('#criteria').textContent='Family judges: How creative is the idea? Would you eat it? Is the plan practical? Give each category 1–5 stars.';$('#criteria').classList.remove('hidden')};$('#save').onclick=()=>{if(index<0)$('#spin').click();ideas.push({name:$('#dish').value.trim()||'Untitled dish',basket:baskets[index].join(', '),recipe:$('#recipe').value});localStorage.setItem(key,JSON.stringify(ideas));render()};$('#download').onclick=()=>{let t=ideas.map(x=>x.name+'\nBasket: '+x.basket+'\n'+x.recipe).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='Mystery_Kitchen_Recipes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
