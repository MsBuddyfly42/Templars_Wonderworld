<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Templar's Story Studio</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#24162d,#121827);color:#fff5e9;font:16px/1.6 system-ui}main{max-width:950px;margin:auto;padding:30px 18px}h1{font:700 clamp(2.3rem,6vw,4rem) Georgia;color:#f6cd82;margin:0}h2{color:#f6cd82}.panel{background:#2c2639;border:1px solid #8c7188;border-radius:18px;padding:22px;margin:16px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;font-weight:700}select,input,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #ab99af;background:#181724;color:#fff;font:inherit}textarea{min-height:290px;resize:vertical}button{padding:12px 16px;border:0;border-radius:10px;background:#edbe6d;color:#22172b;font:700 1rem system-ui;cursor:pointer;margin:5px 5px 5px 0}button:hover{filter:brightness(1.13)}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #9eecf2}.secondary{background:#584562;color:#fff}.prompt{font:1.15rem/1.65 Georgia;white-space:pre-line}.muted{color:#dbcbde}.saved button{display:block;width:100%;text-align:left;background:#443750;color:#fff}</style></head><body><main><p class="muted">An offline creative playground</p><h1>Templar's Story Studio ✒️</h1><p>Choose a world, cast your lead, and spin a twist. Write as much or as little as you like. Your drafts save on this computer in this browser.</p><section class="panel"><div class="row"><label>Story world<select id="world"><option>Greek Mythology</option><option>Fairy Tale</option><option>Modern Mystery</option><option>Arkansas Adventure</option><option>Heartfelt Comeback</option></select></label><label>Main character<select id="hero"><option>A determined founder</option><option>A clever singer</option><option>A retired hero</option><option>A curious grandchild</option><option>A reluctant goddess</option></select></label><label>Surprise twist<select id="twist"><option>A secret letter appears</option><option>The villain asks for help</option><option>An old promise is revealed</option><option>The missing treasure is a person</option><option>Time suddenly stops</option></select></label></div><button id="spin">🎲 Generate my prompt</button><button class="secondary" id="random">✨ Surprise everything</button><div id="prompt" class="prompt" aria-live="polite">Your story begins whenever you are ready.</div></section><section class="panel"><label for="title">Story title</label><input id="title" placeholder="Give your story a name"><label for="draft">Your story</label><textarea id="draft" placeholder="Once upon a time—or right here in Helena..." spellcheck="true"></textarea><div><button id="save">💾 Save draft</button><button id="download">⬇ Download story</button><button class="secondary" id="new">New story</button><button class="secondary" id="add">🎭 Add a new complication</button></div><div id="status" role="status"></div></section><section class="panel"><h2>Saved stories</h2><div class="saved" id="saved">No stories saved yet.</div></section></main><script>(()=>{let $=x=>document.querySelector(x),key='templar-story-studio-v1',stories=[];try{stories=JSON.parse(localStorage.getItem(key))||[]}catch{}let current=null;const openings=['The door opened where no door had been before.','Someone had been waiting for this exact moment.','The town believed the story was over. The town was wrong.','The most ordinary day began with an impossible sound.'];function pick(a){return a[Math.floor(Math.random()*a.length)]}function generate(){let w=$('#world').value,h=$('#hero').value,t=$('#twist').value;$('#prompt').textContent=`In a ${w.toLowerCase()} story, ${h.toLowerCase()} discovers that ${t.toLowerCase()}. ${pick(openings)}\n\nWhat does your character want, and what must they risk to get it?`}function list(){$('#saved').innerHTML='';if(!stories.length){$('#saved').textContent='No stories saved yet.';return}stories.slice().reverse().forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.title+' • '+v.date;b.onclick=()=>{current=stories.length-1-i;$('#title').value=v.title;$('#draft').value=v.text;$('#prompt').textContent=v.prompt||'';$('#status').textContent='Draft loaded.'};$('#saved').append(b)})}function store(){let v={title:$('#title').value.trim()||'Untitled story',text:$('#draft').value,prompt:$('#prompt').textContent,date:new Date().toLocaleString()};if(current===null){stories.push(v);current=stories.length-1}else stories[current]=v;try{localStorage.setItem(key,JSON.stringify(stories));$('#status').textContent='Saved on this computer.'}catch{$('#status').textContent='Browser storage is full. Download your story to keep it.'}list()}function download(){let content=($('#title').value.trim()||'Untitled story')+'\n\n'+$('#draft').value;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=($('#title').value.trim()||'My_Story').replace(/[^a-z0-9_-]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#spin').onclick=generate;$('#random').onclick=()=>{['world','hero','twist'].forEach(x=>{let e=$('#'+x);e.selectedIndex=Math.floor(Math.random()*e.options.length)});generate()};$('#save').onclick=store;$('#download').onclick=download;$('#new').onclick=()=>{current=null;$('#title').value='';$('#draft').value='';generate();$('#status').textContent='New story ready.'};$('#add').onclick=()=>{let twists=['The one person they trusted recognizes the mysterious symbol.','A second letter contradicts the first.','The clock strikes thirteen.','A forgotten song reveals the next clue.','The villain has the same goal for a different reason.'];$('#prompt').textContent+='\n\nNew complication: '+pick(twists)};list();generate()})();</script></body></html>
